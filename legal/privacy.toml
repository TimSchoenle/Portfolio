body.en = '''
This privacy policy explains how your personal data is processed when you visit this website.

## 1. Controller

tim-schoenle.de – Tim Schönle\
c/o Online-Impressum.de #5279\
Europaring 90\
53757 Sankt Augustin\
Germany

**Email:** [contact@tim-schoenle.de](mailto:contact@tim-schoenle.de)\
**Contact form:** <https://mein.online-impressum.de/tim-schoenle-de/#Zweiter_Kontaktweg>

The controller within the meaning of Art. 4(7) GDPR is the person named above.

## 2. General Information

This website is a personal portfolio for professional presentation as a software developer. Personal data is processed only to the extent necessary to provide and secure this website and to respond to contact requests. The legal basis is our legitimate interest in a functional and secure online presence (Art. 6(1)(f) GDPR) and, where applicable, the performance or initiation of a contract (Art. 6(1)(b) GDPR).

## 3. Hosting

Our website is hosted by netcup GmbH, Daimlerstraße 25, 76185 Karlsruhe, Germany (hereinafter 'netcup'). The personal data collected on this website is stored on netcup's servers. This may include, but is not limited to, IP addresses, meta and communication data, website accesses and other data generated via a website. The use of netcup is for the purpose of fulfilling the contract with our potential and existing customers (Art. 6(1)(b) GDPR) and in the interest of a secure, fast and efficient provision of our online offer by a professional provider (Art. 6(1)(f) GDPR). netcup will only process your data to the extent necessary to fulfill its performance obligations and follows our instructions regarding this data. We have concluded a data processing agreement (DPA) with netcup. Further information can be found in netcup's privacy policy: <https://www.netcup.de/kontakt/datenschutzerklaerung.php>

## 4. SSL/TLS Encryption

This website uses SSL/TLS encryption for security reasons and to protect the transmission of confidential content. You can recognize an encrypted connection by the "https://" prefix in your browser's address bar and the lock icon. When SSL/TLS encryption is active, data you transmit to us cannot be read by third parties.

## 5. Access Data and Logs

When visiting this website, the server automatically records log files (IP address, date and time of access, browser type and version, operating system, referrer URL, requested page and amount of data transferred). This data is processed to ensure the security and stability of the website and to detect and investigate misuse. Log files are kept for up to 7 days and then deleted, unless further storage is required for evidence purposes. Server location: Germany. The legal basis is our legitimate interest in secure and reliable operation of the website (Art. 6(1)(f) GDPR).

## 6. Use of Cloudflare

This website is delivered through a Cloudflare Tunnel provided by Cloudflare, Inc., 101 Townsend St, San Francisco, CA 94107, USA. For this purpose, Cloudflare processes technical connection data (in particular IP addresses, requested URLs, system configuration information and other metadata) to deliver and secure the website (e.g. DDoS protection, performance optimization). Cloudflare processes this data as a processor on our behalf under a data processing agreement. Depending on your location, data may be transferred to data centers outside the EU, including the USA. These transfers are protected by Standard Contractual Clauses (Art. 46(2)(c) GDPR) and Cloudflare's certification under the EU-U.S. Data Privacy Framework adequacy decision. Cloudflare has also implemented additional technical and organizational measures to ensure the protection of your data. Processing is based on our legitimate interest in secure and efficient operation of the website (Art. 6(1)(f) GDPR). Further information can be found in Cloudflare's privacy policy: <https://www.cloudflare.com/privacypolicy/>

## 7. Contact

If you contact me by email, the data you provide (in particular email address, name and the content of your message) will be processed for the purpose of handling and responding to your request. The legal basis is Art. 6(1)(b) GDPR where the contact relates to an existing or potential contractual relationship, and otherwise Art. 6(1)(f) GDPR (our legitimate interest in processing inquiries). Your data will not be shared with third parties unless this is necessary to process your request or required by law, and will be deleted when your inquiry has been conclusively answered, unless statutory retention obligations apply.

## 8. Data Subject Rights

You have the rights granted by Articles 15–21 GDPR: in particular the right of access, rectification, erasure, restriction of processing, data portability and objection to processing based on Art. 6(1)(f) GDPR. Where processing is based on consent, you may withdraw consent at any time with effect for the future. You also have the right to lodge a complaint with a supervisory authority, in particular in the Member State of your habitual residence or place of work (Art. 77 GDPR). For Baden-Württemberg, the competent authority is the State Commissioner for Data Protection and Freedom of Information Baden-Württemberg: <https://www.baden-wuerttemberg.datenschutz.de>

## 9. Cookies and Browser Storage

This website itself sets a single cookie and a single entry in your browser's local storage. Both are named `lang` and hold nothing but your language preference ("en" or "de"):

- `lang` (cookie): set on your first visit from your browser's language setting, and updated when you switch the language, so that every page is delivered in your language from the start. First-party only, `SameSite=Lax` (duration: 1 year).
- `lang` (local storage): the same preference, kept by the page's script so that the language you selected persists (stored until you delete it).

Delivery through Cloudflare may set technically necessary cookies:

- `_cf_bm`: bot management and detection of malicious visitors (duration: 30 minutes).
- `__cflb`: session affinity for load balancing (duration: up to 24 hours).
- `__cfruid`: support for rate limiting to distinguish individual users (session cookie).
- `cf_clearance`: set after successful security verification to avoid repeated challenges (duration: 30–60 minutes).
- `cf_chl_rc_i`: supports Cloudflare challenge products (session cookie).
- `cf_chl_rc_ni`: supports Cloudflare challenge products (session cookie).

These entries are technically required to provide the website in the selected language, ensure security, identify malicious visitors and filter web traffic. The storage and access of this technically necessary information is based on § 25(2)(2) TDDDG, as these are used exclusively for the purpose of carrying out the transmission of a communication over a public telecommunications network or are strictly necessary for the provider to supply a service explicitly requested by the user. Therefore, no consent is required for technically necessary cookies. The legal basis for the associated data processing is our legitimate interest in a secure and user-friendly presentation of the website (Art. 6(1)(f) GDPR). No profiling or cross-site tracking takes place. You can delete these entries at any time via your browser settings.

## 10. No Analytics or Tracking

Apart from the technically necessary processing described above, this website uses no tracking tools, analytics, behavioral profiling, advertising networks or social media plugins. No personal data is shared with third parties for marketing or profiling purposes.

## 11. Changes

This privacy policy may be updated if technical or legal changes occur. The latest version will always be available on this page.
'''

