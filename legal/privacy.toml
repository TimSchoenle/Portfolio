# Template for the privacy notice Art. 13 GDPR requires. See legal.toml for the format and for why
# this is a template rather than the published text.
#
# Placeholders: [OPERATOR NAME], [STREET AND NUMBER], [POSTCODE], [CITY], [EMAIL ADDRESS],
# [HOSTING PROVIDER, ADDRESS], [HOSTING PROVIDER PRIVACY URL], [LOG RETENTION DAYS],
# [SUPERVISORY AUTHORITY], [SUPERVISORY AUTHORITY URL].
#
# Section 5 describes delivery through Cloudflare, which the default configuration assumes
# (`csp.cloudflare.script_nonce`). Delete it when no CDN sits in front of the server, and list in
# section 8 only the cookies the CDN actually sets on this site: check them in the browser rather
# than copying a vendor's full list. If error reporting (`sentry.enabled`) is ever switched on,
# the error-reporting service is a further recipient and needs a section of its own.

[legal.documents.privacy]
updated = "2026-09-23"
order = 20
title = { en = "Privacy Policy", de = "Datenschutzerklärung" }

body.en = '''
This privacy policy explains how personal data is processed when you visit this website.

## 1. Controller

[OPERATOR NAME]\
[STREET AND NUMBER]\
[POSTCODE] [CITY]\
Germany

**Email:** [EMAIL ADDRESS]

The controller within the meaning of Art. 4(7) GDPR is the person named above.

## 2. Purpose and legal basis

This website is a personal portfolio. Personal data is processed only to the extent necessary to deliver and secure the website and to answer contact requests. Unless a section below states otherwise, the legal basis is my legitimate interest in a functional and secure website (Art. 6(1)(f) GDPR).

You are not obliged to provide personal data. Without the connection data described below, however, the website cannot be delivered to you. No automated decision-making, including profiling, within the meaning of Art. 22 GDPR takes place.

## 3. Hosting and server logs

This website is hosted by [HOSTING PROVIDER, ADDRESS], which processes data on my behalf under a data processing agreement (Art. 28 GDPR). Further information: [HOSTING PROVIDER PRIVACY URL]

When you visit the website, the IP address, the date and time of access, the requested page, the referrer URL, the browser type and version, the operating system and the amount of data transferred are recorded in server logs. This data is processed to deliver the website and to detect and investigate misuse. Logs are deleted after [LOG RETENTION DAYS] days unless an individual incident requires longer retention as evidence. The legal basis is Art. 6(1)(f) GDPR.

## 4. Encryption

This website is served exclusively over HTTPS (TLS). Data you transmit is encrypted in transit, so it cannot be read by third parties on the way between your browser and the delivery infrastructure described in sections 3 and 5.

## 5. Delivery through Cloudflare

This website is delivered through Cloudflare, Inc., 101 Townsend St, San Francisco, CA 94107, USA, which terminates the encrypted connection and forwards requests to the server. For this purpose Cloudflare processes connection data, in particular IP addresses, requested URLs, request headers and technical metadata, to deliver the website and protect it against attacks. Cloudflare acts as a processor under a data processing agreement. Data may be processed in data centers outside the EU, including in the USA. Such transfers are based on the European Commission's adequacy decision for the EU-U.S. Data Privacy Framework, under which Cloudflare is certified, and on Standard Contractual Clauses (Art. 46(2)(c) GDPR). The legal basis is Art. 6(1)(f) GDPR. Further information: <https://www.cloudflare.com/privacypolicy/>

## 6. Contact

If you contact me by email, the data you provide (in particular your email address, your name and the content of your message) is processed to handle and answer your request. The legal basis is Art. 6(1)(b) GDPR where the request concerns a contract or its initiation, and Art. 6(1)(f) GDPR otherwise. The data is deleted once the request has been conclusively dealt with, unless statutory retention obligations apply.

## 7. Your rights

You have the right of access (Art. 15 GDPR), rectification (Art. 16 GDPR), erasure (Art. 17 GDPR), restriction of processing (Art. 18 GDPR) and data portability (Art. 20 GDPR). You also have the right to lodge a complaint with a supervisory authority (Art. 77 GDPR), in particular in the Member State of your habitual residence or place of work. The authority competent for the controller is [SUPERVISORY AUTHORITY]: [SUPERVISORY AUTHORITY URL]

**Right to object (Art. 21 GDPR):** Where processing is based on Art. 6(1)(f) GDPR, you have the right to object to it at any time on grounds relating to your particular situation. An email to the address above is sufficient.

## 8. Cookies and browser storage

This website sets one cookie and one local storage entry. Both are named `lang` and hold nothing but your language preference (`en` or `de`):

- `lang` (cookie): set from your browser's language settings when you first visit, and updated when you switch the language, so that every page is delivered in your language from the first byte. First-party, `SameSite=Lax`, expires after one year.
- `lang` (local storage): the same preference, kept by the page's script so that a language you select persists. Stored until you delete it.

Delivery through Cloudflare may set the following technically necessary cookies:

- `__cf_bm`: distinguishes humans from bots (expires after 30 minutes).
- `cf_clearance`: records a passed security challenge so it is not repeated (expires after 30 minutes by default).

Storing and reading these entries is strictly necessary to provide the website you requested in your language and to protect it against attacks, and is therefore permitted without consent under § 25(2) no. 2 TDDDG. The legal basis for the associated processing is Art. 6(1)(f) GDPR. You can delete these entries at any time in your browser settings.

## 9. No analytics or tracking

This website uses no analytics, tracking, advertising or social media plugins, and no personal data is shared for marketing or profiling purposes.

## 10. Changes

This privacy policy is updated when the processing it describes changes. The current version is always available on this page.
'''

body.de = '''
Diese Datenschutzerklärung informiert darüber, wie personenbezogene Daten beim Besuch dieser Website verarbeitet werden.

## 1. Verantwortlicher

[NAME DES BETREIBERS]\
[STRASSE UND HAUSNUMMER]\
[PLZ] [ORT]\
Deutschland

**E-Mail:** [E-MAIL-ADRESSE]

Verantwortlicher im Sinne von Art. 4 Nr. 7 DSGVO ist die oben genannte Person.

## 2. Zweck und Rechtsgrundlage

Diese Website ist ein persönliches Portfolio. Personenbezogene Daten werden nur verarbeitet, soweit dies zur Auslieferung und Absicherung der Website und zur Beantwortung von Kontaktanfragen erforderlich ist. Soweit ein Abschnitt unten nichts anderes angibt, ist Rechtsgrundlage mein berechtigtes Interesse an einer funktionsfähigen und sicheren Website (Art. 6 Abs. 1 lit. f DSGVO).

Sie sind nicht verpflichtet, personenbezogene Daten bereitzustellen. Ohne die unten beschriebenen Verbindungsdaten kann die Website jedoch nicht an Sie ausgeliefert werden. Eine automatisierte Entscheidungsfindung einschließlich Profiling im Sinne von Art. 22 DSGVO findet nicht statt.

## 3. Hosting und Server-Logdateien

Diese Website wird bei [HOSTING-ANBIETER, ANSCHRIFT] gehostet, der die Daten in meinem Auftrag auf Grundlage eines Vertrags zur Auftragsverarbeitung (Art. 28 DSGVO) verarbeitet. Weitere Informationen: [DATENSCHUTZ-URL DES HOSTING-ANBIETERS]

Beim Aufruf der Website werden IP-Adresse, Datum und Uhrzeit des Abrufs, aufgerufene Seite, Referrer-URL, Browsertyp und -version, Betriebssystem und übertragene Datenmenge in Server-Logdateien erfasst. Diese Daten werden verarbeitet, um die Website auszuliefern sowie Missbrauch zu erkennen und aufzuklären. Die Logdateien werden nach [AUFBEWAHRUNG IN TAGEN] Tagen gelöscht, sofern ein konkreter Vorfall keine längere Aufbewahrung zu Beweiszwecken erfordert. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO.

## 4. Verschlüsselung

Diese Website wird ausschließlich über HTTPS (TLS) ausgeliefert. Von Ihnen übermittelte Daten werden bei der Übertragung verschlüsselt und können auf dem Weg zwischen Ihrem Browser und der in den Abschnitten 3 und 5 beschriebenen Auslieferungsinfrastruktur nicht von Dritten mitgelesen werden.

## 5. Auslieferung über Cloudflare

Diese Website wird über Cloudflare, Inc., 101 Townsend St, San Francisco, CA 94107, USA ausgeliefert. Cloudflare terminiert die verschlüsselte Verbindung und leitet Anfragen an den Server weiter. Dazu verarbeitet Cloudflare Verbindungsdaten, insbesondere IP-Adressen, aufgerufene URLs, Anfrage-Header und technische Metadaten, um die Website auszuliefern und vor Angriffen zu schützen. Cloudflare ist als Auftragsverarbeiter auf Grundlage eines Vertrags zur Auftragsverarbeitung tätig. Daten können in Rechenzentren außerhalb der EU, auch in den USA, verarbeitet werden. Grundlage dieser Übermittlungen sind der Angemessenheitsbeschluss der Europäischen Kommission zum EU-US Data Privacy Framework, unter dem Cloudflare zertifiziert ist, sowie Standardvertragsklauseln (Art. 46 Abs. 2 lit. c DSGVO). Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO. Weitere Informationen: <https://www.cloudflare.com/privacypolicy/>

## 6. Kontaktaufnahme

Wenn Sie mich per E-Mail kontaktieren, werden die von Ihnen mitgeteilten Daten (insbesondere E-Mail-Adresse, Name und Inhalt der Nachricht) zur Bearbeitung und Beantwortung Ihrer Anfrage verarbeitet. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO, sofern die Anfrage einen Vertrag oder dessen Anbahnung betrifft, und im Übrigen Art. 6 Abs. 1 lit. f DSGVO. Die Daten werden gelöscht, sobald die Anfrage abschließend bearbeitet ist und keine gesetzlichen Aufbewahrungspflichten entgegenstehen.

## 7. Ihre Rechte

Sie haben das Recht auf Auskunft (Art. 15 DSGVO), Berichtigung (Art. 16 DSGVO), Löschung (Art. 17 DSGVO), Einschränkung der Verarbeitung (Art. 18 DSGVO) und Datenübertragbarkeit (Art. 20 DSGVO). Zudem haben Sie das Recht, sich bei einer Datenschutz-Aufsichtsbehörde zu beschweren (Art. 77 DSGVO), insbesondere in dem Mitgliedstaat Ihres gewöhnlichen Aufenthaltsorts oder Ihres Arbeitsplatzes. Für den Verantwortlichen zuständig ist [AUFSICHTSBEHÖRDE]: [URL DER AUFSICHTSBEHÖRDE]

**Widerspruchsrecht (Art. 21 DSGVO):** Soweit eine Verarbeitung auf Art. 6 Abs. 1 lit. f DSGVO beruht, können Sie ihr aus Gründen, die sich aus Ihrer besonderen Situation ergeben, jederzeit widersprechen. Eine E-Mail an die oben genannte Adresse genügt.

## 8. Cookies und Browser-Speicher

Diese Website setzt ein Cookie und einen Eintrag im lokalen Speicher Ihres Browsers. Beide heißen `lang` und enthalten ausschließlich Ihre Sprachpräferenz (`en` oder `de`):

- `lang` (Cookie): wird beim ersten Besuch anhand der Spracheinstellungen Ihres Browsers gesetzt und beim Wechsel der Sprache aktualisiert, damit jede Seite von Beginn an in Ihrer Sprache ausgeliefert wird. Erstanbieter, `SameSite=Lax`, Gültigkeitsdauer ein Jahr.
- `lang` (lokaler Speicher): dieselbe Präferenz, vom Skript der Seite gespeichert, damit eine gewählte Sprache erhalten bleibt. Gespeichert, bis Sie den Eintrag löschen.

Durch die Auslieferung über Cloudflare können folgende technisch notwendige Cookies gesetzt werden:

- `__cf_bm`: unterscheidet Menschen von Bots (Gültigkeitsdauer 30 Minuten).
- `cf_clearance`: speichert eine bestandene Sicherheitsprüfung, damit sie nicht wiederholt wird (Gültigkeitsdauer standardmäßig 30 Minuten).

Das Speichern und Auslesen dieser Einträge ist unbedingt erforderlich, um die von Ihnen aufgerufene Website in Ihrer Sprache bereitzustellen und vor Angriffen zu schützen, und ist daher nach § 25 Abs. 2 Nr. 2 TDDDG ohne Einwilligung zulässig. Rechtsgrundlage für die damit verbundene Verarbeitung ist Art. 6 Abs. 1 lit. f DSGVO. Sie können diese Einträge jederzeit in den Einstellungen Ihres Browsers löschen.

## 9. Keine Analyze- und Tracking-Dienste

Diese Website verwendet keine Analyse-, Tracking- oder Werbedienste und keine Social-Media-Plugins. Personenbezogene Daten werden nicht zu Marketing- oder Profiling-Zwecken weitergegeben.

## 10. Änderungen

Diese Datenschutzerklärung wird aktualisiert, wenn sich die beschriebene Verarbeitung ändert. Die jeweils aktuelle Fassung ist stets auf dieser Seite abrufbar.
