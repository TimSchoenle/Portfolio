## Consumer dispute resolution

I am neither willing nor obliged to participate in dispute resolution proceedings before a consumer arbitration board (§ 36 VSBG).

## Liability for content

As a service provider, I am responsible for my own content on these pages under the general laws, in accordance with § 7(1) of the German Digital Services Act (Digitale-Dienste-Gesetz, DDG). Under §§ 8 to 10 DDG, however, I am not obliged to monitor transmitted or stored third-party information or to investigate circumstances that indicate illegal activity. Obligations to remove or block the use of information under the general laws remain unaffected. Liability in this respect is only possible from the time a specific infringement becomes known. On becoming aware of such an infringement, I will remove the content concerned without delay.

## Liability for links

This website contains links to external third-party websites whose content I have no influence over, so I cannot accept any liability for that content. The respective provider or operator of a linked page is always responsible for its content. The linked pages were checked for possible legal violations at the time of linking, and no illegal content was apparent then. Permanent monitoring of the linked pages is not reasonable without concrete indications of an infringement. On becoming aware of an infringement, I will remove the link concerned without delay.

## Copyright

The content and works created by the site operator on these pages are subject to German copyright law. Reproduction, editing, distribution and any kind of use outside the limits of copyright law require the written consent of the author. Downloads and copies of this site are permitted for private, non-commercial use only. Where content on this site was not created by the operator, the copyrights of third parties are respected. Should you nevertheless become aware of a copyright infringement, please let me know. On becoming aware of an infringement, I will remove the content concerned without delay.
'''

