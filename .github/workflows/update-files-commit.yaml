name: Update Files Commit

# Commits what `Update Files` generated on a pull request. A pull_request run executes the pull
# request's own copy of its workflow, so a job there holding the maintenance App's key hands it to
# anyone who can push a branch. This workflow_run workflow runs the default branch's copy, which a
# pull request cannot change, and only reads the patches the pull_request run uploaded: commit-patch
# refuses anything outside allowed_paths or made from another head, and nothing from the branch
# executes.
#
# The jobs commit in order, each only when the patches before it were empty, so one ref has one
# pusher at a time. A commit starts a new pull_request run on the new head, which regenerates the
# later files against it.

on:
  workflow_run:
    workflows: ['Update Files']
    types: [completed]

# Shares the per-branch group with build-commit.yaml, the other writer to a pull request's branch,
# so two commits never race for the same head. A queued run whose head is stale commits nothing:
# commit-patch reports branch_moved.
concurrency:
  group: branch-writes-${{ github.repository }}:${{ github.event.workflow_run.head_branch }}
  queue: max

permissions: { }

jobs:
  # The find jobs hold no secret and no environment. The pull_request run uploads a patch empty
  # when nothing changed and not at all when the job making it was skipped or failed; either way
  # there is nothing to commit, so the commit job is skipped without minting a token.
  find-lock-file-patch:
    name: Find The Lock File Patch
    # A finished pull_request run, not a cancelled one: another job failing does not make the patch
    # wrong. From a branch of this repository, never the default branch.
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to list and download the pull_request run's artifacts
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Validates the patch exactly as commit-patch will, against the head the pull_request run
      # checked out, and reports whether it holds anything to commit. Nothing in it is executed.
      - name: Find The Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/find-patch@7b20a67f0b18a6e64c30e5f47c92636729f6ad41 # tag=actions-common-find-patch-v1.1.0
        with:
          run_id: ${{ github.event.workflow_run.id }}
          artifact_name: cargo-lock
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}

  find-rendered-files-patch:
    name: Find The Rendered Files Patch
    # A finished pull_request run, not a cancelled one: another job failing does not make the patch
    # wrong. From a branch of this repository, never the default branch.
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to list and download the pull_request run's artifacts
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      readme_changed: ${{ steps.touched.outputs.readme_changed }}
      config_changed: ${{ steps.touched.outputs.config_changed }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Validates the patch exactly as commit-patch will, against the head the pull_request run
      # checked out, and reports whether it holds anything to commit. Nothing in it is executed.
      - name: Find The Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/find-patch@7b20a67f0b18a6e64c30e5f47c92636729f6ad41 # tag=actions-common-find-patch-v1.1.0
        with:
          run_id: ${{ github.event.workflow_run.id }}
          artifact_name: render-generated-files
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}

      # Only the paths the validated patch names are read; nothing in it is executed.
      - name: Note Which Files The Patch Touches
        id: touched
        if: steps.patch.outputs.has_changes == 'true'
        env:
          PATCH: ${{ steps.patch.outputs.directory }}/changes.patch
        run: |
          set -euo pipefail
          touched() {
            if grep -Eq "$1" "${PATCH}"; then echo true; else echo false; fi
          }
          {
            echo "readme_changed=$(touched '^diff --git a/README\.md ')"
            echo "config_changed=$(touched '^diff --git a/config\.example\.toml ')"
          } >> "$GITHUB_OUTPUT"

  find-config-contract-patch:
    name: Find The Config Contract Patch
    # A finished pull_request run, not a cancelled one: another job failing does not make the patch
    # wrong. From a branch of this repository, never the default branch.
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to list and download the pull_request run's artifacts
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Validates the patch exactly as commit-patch will, against the head the pull_request run
      # checked out, and reports whether it holds anything to commit. Nothing in it is executed.
      - name: Find The Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/find-patch@7b20a67f0b18a6e64c30e5f47c92636729f6ad41 # tag=actions-common-find-patch-v1.1.0
        with:
          run_id: ${{ github.event.workflow_run.id }}
          artifact_name: config-contract
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}

  update-lock-file:
    name: Ensure Cargo Lock File is Up-to-Date
    needs: [find-lock-file-patch]
    if: needs.find-lock-file-patch.outputs.has_changes == 'true'
    # Where ACTIONS_MAINTENANCE_APP_ID and ACTIONS_MAINTENANCE_PRIVATE_KEY live. Only the commit
    # jobs, which run no repository code, get it.
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # to download the patch from the pull_request run
      contents: read # to fetch the commit the patch applies to; the write uses the App token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # to commit the lock file
          permission-pull-requests: write # to comment on the pull request

      # Any path outside `allowed_paths` fails this job and nothing is committed. A branch that
      # moved past the head the patch was made from is left alone: the run on the new head decides.
      - name: Commit the patch
        id: commit
        uses: TimSchoenle/actions/actions/common/commit-patch@7b20a67f0b18a6e64c30e5f47c92636729f6ad41 # tag=actions-common-commit-patch-v1.3.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          run_id: ${{ github.event.workflow_run.id }}
          branch: ${{ github.event.workflow_run.head_branch }}
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}
          artifact_name: cargo-lock
          allowed_paths: 'Cargo.lock'
          commit_message: 'build: update Cargo.lock'

      - name: Comment on PR
        if: >-
          steps.commit.outputs.changes_committed == 'true' &&
          github.event.workflow_run.pull_requests[0].number
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-upsert-pr-comment-v2.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          # Only this App's own comment is updated; a pasted marker cannot redirect the edit.
          author: '${{ steps.generate_token.outputs.app-slug }}[bot]'
          pr_url: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.workflow_run.pull_requests[0].number }}
          identifier: cargo-lock-updated
          body: 'Cargo.lock has been updated to match Cargo.toml.'

  render-generated-files:
    name: Ensure the Generated Files are Rendered from their Templates
    needs: [find-lock-file-patch, find-rendered-files-patch]
    # A lock-file commit starts a run on the new head, which renders against it.
    if: >-
      needs.find-lock-file-patch.outputs.has_changes == 'false' &&
      needs.find-rendered-files-patch.outputs.has_changes == 'true'
    # Where ACTIONS_MAINTENANCE_APP_ID and ACTIONS_MAINTENANCE_PRIVATE_KEY live. Only the commit
    # jobs, which run no repository code, get it.
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # to download the patch from the pull_request run
      contents: read # to fetch the commit the patch applies to; the write uses the App token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # to commit the rendered files
          permission-pull-requests: write # to comment on the pull request

      # Any path outside `allowed_paths` fails this job and nothing is committed. A branch that
      # moved past the head the patch was made from is left alone: the run on the new head decides.
      - name: Commit the patch
        id: commit
        uses: TimSchoenle/actions/actions/common/commit-patch@7b20a67f0b18a6e64c30e5f47c92636729f6ad41 # tag=actions-common-commit-patch-v1.3.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          run_id: ${{ github.event.workflow_run.id }}
          branch: ${{ github.event.workflow_run.head_branch }}
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}
          artifact_name: render-generated-files
          allowed_paths: 'README.md config.example.toml'
          commit_message: 'docs: render the generated files from their templates'

      # One comment for both, naming only what changed. Each line is literal text gated on what
      # the patch touched, so nothing a contributor controls reaches the body.
      - name: Comment on PR
        if: >-
          steps.commit.outputs.changes_committed == 'true' &&
          github.event.workflow_run.pull_requests[0].number
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-upsert-pr-comment-v2.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          # Only this App's own comment is updated; a pasted marker cannot redirect the edit.
          author: '${{ steps.generate_token.outputs.app-slug }}[bot]'
          pr_url: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.workflow_run.pull_requests[0].number }}
          identifier: render-generated-files
          header: 'Re-rendered from the configuration types in `crates/config`:'
          body_lines: |
            ${{ needs.find-rendered-files-patch.outputs.readme_changed == 'true' && '- `README.md`, from `.github/templates/README.md.hbs`' || '' }}
            ${{ needs.find-rendered-files-patch.outputs.config_changed == 'true' && '- `config.example.toml`, from `.github/templates/config.example.toml.hbs`' || '' }}

  sync-config-contract:
    name: Ensure the Config Contract and its Labels Match the Types
    needs: [find-lock-file-patch, find-rendered-files-patch, find-config-contract-patch]
    # Either earlier commit starts a run on the new head, which regenerates the contract against it.
    if: >-
      needs.find-lock-file-patch.outputs.has_changes == 'false' &&
      needs.find-rendered-files-patch.outputs.has_changes == 'false' &&
      needs.find-config-contract-patch.outputs.has_changes == 'true'
    # Where ACTIONS_MAINTENANCE_APP_ID and ACTIONS_MAINTENANCE_PRIVATE_KEY live. Only the commit
    # jobs, which run no repository code, get it.
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # to download the patch from the pull_request run
      contents: read # to fetch the commit the patch applies to; the write uses the App token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # to commit the regenerated contract
          permission-pull-requests: write # to comment on the pull request

      # Any path outside `allowed_paths` fails this job and nothing is committed. A branch that
      # moved past the head the patch was made from is left alone: the run on the new head decides.
      - name: Commit the patch
        id: commit
        uses: TimSchoenle/actions/actions/common/commit-patch@7b20a67f0b18a6e64c30e5f47c92636729f6ad41 # tag=actions-common-commit-patch-v1.3.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          run_id: ${{ github.event.workflow_run.id }}
          branch: ${{ github.event.workflow_run.head_branch }}
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}
          artifact_name: config-contract
          allowed_paths: 'docs/config.contract.json'
          commit_message: 'docs: regenerate the configuration contract'

      - name: Comment on PR
        if: >-
          steps.commit.outputs.changes_committed == 'true' &&
          github.event.workflow_run.pull_requests[0].number
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-upsert-pr-comment-v2.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          # Only this App's own comment is updated; a pasted marker cannot redirect the edit.
          author: '${{ steps.generate_token.outputs.app-slug }}[bot]'
          pr_url: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.workflow_run.pull_requests[0].number }}
          identifier: config-contract-sync
          header: 'Regenerated from the configuration types in `crates/config`:'
          body_lines: |
            - `docs/config.contract.json`, from `config-schema --format contract`
          footer: 'The `Config Contract` job in **Build** gates it, and runs again on this push.'
