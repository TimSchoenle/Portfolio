name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Trunk + WASM + resumes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Setup Node (Tailwind CSS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tailwind CSS
        working-directory: apps/frontend
        run: npm install

      # repos.json is generated at build time by the update-repos Trunk hook.
      # Persisting it across runs (keyed by a ~10h window, matching the CI cache
      # TTL) lets the hook reuse a fresh file instead of calling the GitHub API
      # on every build, which keeps us well under its rate limits.
      - name: Repos cache window
        id: repos-cache
        run: echo "window=$(( $(date +%s) / 36000 ))" >> "$GITHUB_OUTPUT"

      - name: Cache repos.json (GitHub API rate limits)
        uses: actions/cache@v4
        with:
          path: apps/frontend/repos.json
          key: ${{ runner.os }}-repos-json-${{ steps.repos-cache.outputs.window }}
          restore-keys: ${{ runner.os }}-repos-json-

      # Generate the resume PDFs + resume-fingerprint.json BEFORE the frontend
      # build so the fingerprint is embedded into the WASM (build.rs) and the
      # PDFs are picked up by the index.html copy-dir link.
      - name: Generate resume PDFs
        run: cargo run --release -p resume-generator -- apps/frontend/generated

      - name: Build release
        working-directory: apps/frontend
        env:
          # Authenticates the update-repos hook so it isn't rate-limited; CI is
          # set automatically, so the 10h cache TTL applies.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: trunk build --release

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: apps/frontend/dist/
          retention-days: 7

  check:
    name: Test + Clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-check-${{ hashFiles('Cargo.toml', '**/Cargo.toml') }}

      - name: Tests (data crate, incl. i18n key parity)
        run: cargo test -p portfolio-data

      - name: Clippy (frontend, wasm)
        run: cargo clippy -p frontend --target wasm32-unknown-unknown -- -D warnings

      - name: Clippy (native crates)
        run: cargo clippy -p portfolio-data -p server -p resume-generator -p update-repos -- -D warnings

      - name: Format check
        run: cargo fmt --check

  security:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit
