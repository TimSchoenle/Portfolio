name: Refresh repos.json

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  update:
    name: Fetch GitHub repos and commit repos.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-update-repos-${{ hashFiles('Cargo.toml', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-update-repos-

      - name: Fetch configured repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run --release -p update-repos -- apps/frontend/repos.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/repos.json
          if git diff --cached --quiet; then
            echo "No changes to repos.json"
          else
            git commit -m "chore: refresh repos.json [skip ci]"
            git push
          fi
