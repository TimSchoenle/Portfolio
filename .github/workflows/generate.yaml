name: Generate

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  # Every job below that writes to the pull request comes in two halves, and the split is the
  # security boundary of this workflow.
  #
  # The first half builds the pull request's code: `cargo fetch`, `cargo run`, `just`. That is
  # code the pull request controls — every build script and proc macro in the graph, and the
  # toolchain `rust-toolchain.toml` names — so the half that runs it holds no secret and a
  # read-only `GITHUB_TOKEN`, and hands on only data: a `create-patch` artifact of the files it
  # changed, against the head this run was started for.
  #
  # The second half lives in generate-commit.yaml, a workflow_run workflow that runs the default
  # branch's copy of itself, so a pull request cannot edit it. It holds the maintenance App's
  # private key and the write token minted from it, and runs nothing from the branch: commit-patch
  # applies the merged patch, refuses any path outside its `allowed_paths`, and commits only while
  # the branch still points at the head the patch was made from. Were both halves one job,
  # anything the first ran could read the key out of the runner's memory (the runner user has
  # passwordless `sudo`) or leave a process behind to collect the token once it was minted — a
  # compromised crate arriving in a Renovate pull request would be enough.
  #
  # A pull request from a fork gets no secrets, and its branch does not exist in this repository,
  # so there is nothing to commit to: the commit half skips a run from one, and Generated Files
  # stays red on a fork until its author commits the files. The gates in `build.yaml` also run, and
  # report a stale README, example configuration or contract on a fork.
  #
  # The generators run side by side against the head this run was started for and write disjoint
  # files. The Generated Files job merges their patches, and the commit half commits them as one
  # commit, which starts a new run on the new head.
  #
  # No `paths` filter: the Generated Files check has to report on every pull request to be required.
  generate-lock-file:
    name: Sync Cargo.lock with Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      artifact_name: ${{ steps.patch.outputs.artifact_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Sync Cargo.lock with Cargo.toml
        run: cargo fetch

      - name: Hand the lock file on
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-create-patch-v2.0.0
        with:
          artifact_name: cargo-lock
          paths: Cargo.lock

  # `README.md` and `config.example.toml` are both rendered from templates under
  # `.github/templates/`, and both are interpolated from the same payload: the configuration
  # reference generated out of the `Describe` derives in `crates/config`. Neither document can
  # drift from the types — renaming a key renames it in the tables, in the prose that names it,
  # and in the example file, all in the same pull request.
  #
  # A job of its own rather than more steps above, so it runs beside the lock file sync.
  generate-rendered-files:
    name: Render the Documents from their Templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      artifact_name: ${{ steps.patch.outputs.artifact_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      # One run, one payload, both templates. The names the templates read are declared beside
      # the schema that produces them (`--format variables` in `examples/config-schema.rs`), so
      # widening what the documents interpolate is a change to that file rather than to a shell
      # snippet embedded here — and an unread name costs a template nothing, because strict mode
      # fails on a reference the payload does not define, never on a definition nothing reads.
      #
      # The generator reads nothing from the environment, so it produces the same payload here as
      # on a developer's machine, which is what keeps the patch empty, and the commit skipped, when
      # the configuration has not changed. Cargo's progress goes to stderr, so stdout is the payload
      # and nothing else; it is already strict JSON on one line, and `$(…)` drops the newline
      # `println!` puts after it.
      - name: Generate the configuration payload
        id: config-schema
        run: |
          set -euo pipefail
          variables="$(cargo run -q -p portfolio-config --features config-schema \
            --example config-schema -- --format variables)"
          echo "variables=${variables}" >> "$GITHUB_OUTPUT"

      # The other half of the README's payload: name, description, version, license, toolchain and
      # the `docs/` index, read out of the root `Cargo.toml` and a walk of `docs/`. The
      # configuration payload above is handed to it as `extra` and deep-merged over what it
      # derived, which is safe here because the generator emits no key this action also emits —
      # `serverConfigTable`, `builderConfigTable`, `exampleConfig`, `loader` and `keys` against
      # `repo`, `release`, `toolchain` and `docs`. A same-named key would replace, not merge, so
      # adding one to the generator means checking that list first.
      #
      # `branch` is pinned to the default branch rather than left at its `github.ref_name` default,
      # which on a pull_request event is `<number>/merge`: the badge and permalink URLs would then
      # differ between this render and the gate that re-renders on `main`, and every merge would
      # fail that gate for a reason absent from its diff.
      - name: Collect the README payload
        id: readme-variables
        uses: TimSchoenle/actions/actions/common/readme-variables@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-readme-variables-v2.1.3
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config-schema.outputs.variables }}

      # The example configuration stays on the raw generator payload: it interpolates nothing
      # the merge adds. The payloads stay step outputs, which the runner does not filter against
      # its masks the way it filters job outputs.
      - name: Render the README
        uses: TimSchoenle/actions/actions/common/render-template@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-render-template-v3.0.3
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.readme-variables.outputs.variables }}

      - name: Render the example configuration
        uses: TimSchoenle/actions/actions/common/render-template@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-render-template-v3.0.3
        with:
          template: .github/templates/config.example.toml.hbs
          output: config.example.toml
          variables: ${{ steps.config-schema.outputs.variables }}

      - name: Hand the rendered files on
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-create-patch-v2.0.0
        with:
          artifact_name: render-generated-files
          paths: README.md config.example.toml

  # The configuration contract the image publishes, `docs/config.contract.json`, which a chart's
  # CI reads to check that what it renders is what this image loads.
  #
  # The Dockerfile's `terrace-config:labels` region is deliberately not regenerated here, as in
  # TankoVault and discord-alertmanager. Its three values (envelope version, in-image path, loader
  # prefix) move only with a deliberate change to the prefix, and a bot editing the build recipe
  # is a change nobody reviewed. `Config Contract` in `build.yaml` reports the drift, and
  # `just regenerate` locally is the fix.
  #
  # The contract was gate-only, and the gate had a case it could not clear on its own. `app.version` in
  # the contract is `CARGO_PKG_VERSION`, so a release pull request — which moves the version and
  # nothing else — makes the committed contract stale by construction, and release-please has no
  # step that would regenerate it. Every release was therefore red on Config Contract until
  # someone pushed the regenerated file by hand, and the check is not a required one, so the
  # alternative outcome was worse: a release merging with a contract naming the previous version,
  # published to the chart repository as the description of an image that does not match it.
  #
  # Regenerating here fixes the general case as well as that one, and on the same terms as the
  # documents above: the generator reads nothing from the environment, so a pull request that did
  # not touch the configuration surface produces no commit.
  #
  # The gate in `build.yaml` stays: this makes the branch converge, that refuses to let it merge
  # before it has.
  generate-config-contract:
    name: Regenerate the Config Contract and its Labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      artifact_name: ${{ steps.patch.outputs.artifact_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      # The recipe a developer runs before pushing, minus `dockerfile-labels` (see the job comment).
      #
      # `--revision` and `--created` are deliberately not passed, exactly as in the gate: they
      # move between builds of the same source, so the committed copy carries neither and the
      # copy the image publishes carries both. What is committed here is the configuration half.
      - name: Regenerate the configuration contract
        run: just contract-json

      - name: Hand the regenerated contract on
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-create-patch-v2.0.0
        with:
          artifact_name: config-contract
          paths: docs/config.contract.json

  # `cargo fmt` runs the toolchain `rust-toolchain.toml` names and honours any `rustfmt.toml`, both
  # of which the pull request controls, so it is a generator like the others above: a read-only
  # token, and only a patch handed on.
  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Required to checkout the code
    outputs:
      has_changes: ${{ steps.format.outputs.changes_detected }}
      artifact_name: ${{ steps.format.outputs.artifact_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The pull request head, not the default merge commit: the patch is committed to the branch,
      # so it has to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Auto Format
        id: format
        uses: TimSchoenle/actions/actions/rust/auto-format@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-rust-auto-format-v2.0.3
        with:
          artifact_name: rust-auto-format

  # The required check. It needs every generator above and runs whatever their result, so it
  # reports on every pull request.
  verdict:
    name: Generated Files
    needs: [ generate-lock-file, generate-rendered-files, generate-config-contract, fmt ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to check out the commit the merged patch is made from
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Generated Files Verdict
        uses: TimSchoenle/actions/actions/common/generated-files-verdict@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-generated-files-verdict-v1.2.2
        with:
          needs: ${{ toJSON(needs) }}
