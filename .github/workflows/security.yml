name: Security

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]
  # Advisories are published against dependencies we already ship, so the scan
  # has to run on a clock as well as on changes — otherwise a crate that was
  # clean at merge time is never re-checked.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  # jactionlint audits the workflows themselves: it keeps every actionlint check and has a rule for
  # every zizmor audit. The shared action runs the pedantic profile online, so it also asks GitHub
  # about the actions in use (impostor commits, vulnerable versions, moved tags, archived
  # repositories), uploads the SARIF to code scanning under the category jactionlint and, with
  # strict-exit, fails on findings of every level. .github/jactionlint.yaml turns off the rules this
  # repository does not want.
  action-lint:
    name: Action Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
      security-events: write # to upload SARIF results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: TimSchoenle/actions/actions/security/jactionlint@0701d3b35ad7e10e3159471c82f4743b67fdc01f # tag=actions-security-jactionlint-v1.1.3
        with:
          online: 'true'
          strict-exit: 'true'

  # RustSec advisories against the committed Cargo.lock. Nothing else covers
  # this: `dependency-review` only inspects dependencies a PR changes, and the
  # Trivy image scan sees a `scratch` image holding one stripped static binary —
  # no OS packages and no embedded dependency manifest to match advisories
  # against — so without this job the Rust tree is effectively unscanned.
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-audit

      # cargo-audit drops ignored advisories from its report without saying so,
      # so surface the list here — an ignore nobody can see is an ignore nobody
      # revisits.
      - name: Show suppressed advisories
        run: |
          echo "::group::.cargo/audit.toml"
          cat .cargo/audit.toml
          echo "::endgroup::"

      # Fails on vulnerabilities only. Informational advisories (unmaintained,
      # yanked) are printed but do not fail the build: they frequently have no
      # remedy at all — the current five are unmaintained crates reached through
      # typst, with no maintained replacement — and a check that cannot be made
      # green is a check people learn to ignore. Findings that *can* be acted on
      # still block.
      - name: Audit dependencies
        run: cargo audit

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Licenses, bans, advisories and sources for the whole workspace, per deny.toml.
      - name: Check the dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features