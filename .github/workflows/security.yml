name: Security

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]
  # Advisories are published against dependencies we already ship, so the scan
  # has to run on a clock as well as on changes — otherwise a crate that was
  # clean at merge time is never re-checked.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
      actions: read # to read action configurations
      security-events: write # to upload SARIF results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          persona: pedantic

  # RustSec advisories against the committed Cargo.lock. Nothing else covers
  # this: `dependency-review` only inspects dependencies a PR changes, and the
  # Trivy image scan sees a `scratch` image holding one stripped static binary —
  # no OS packages and no embedded dependency manifest to match advisories
  # against — so without this job the Rust tree is effectively unscanned.
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-audit

      # cargo-audit drops ignored advisories from its report without saying so,
      # so surface the list here — an ignore nobody can see is an ignore nobody
      # revisits.
      - name: Show suppressed advisories
        run: |
          echo "::group::.cargo/audit.toml"
          cat .cargo/audit.toml
          echo "::endgroup::"

      # Fails on vulnerabilities only. Informational advisories (unmaintained,
      # yanked) are printed but do not fail the build: they frequently have no
      # remedy at all — the current five are unmaintained crates reached through
      # typst, with no maintained replacement — and a check that cannot be made
      # green is a check people learn to ignore. Findings that *can* be acted on
      # still block.
      - name: Audit dependencies
        run: cargo audit