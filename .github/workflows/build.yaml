name: Build

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@5798c7bd8d1d98a0c7360114e91a0ac3b86bf145 # tag=actions-rust-cargo-check-v1.1.5

  # The committed contract is what a deployment pipeline reads to check that what a chart renders
  # is what this image loads, so it has to be the contract these types produce. Regenerating and
  # diffing makes a configuration change visible in the pull request that makes it: a removed key
  # shows up in the diff, next to the chart it is about to break.
  #
  # The gate stays now that `update-files.yaml` regenerates both artefacts and commits them: the
  # two answer different questions. That workflow makes a pull request converge on the contract
  # its types produce; this one refuses to let one merge before it has. A copy that arrives a
  # commit late is a gate passing against the wrong document, and this job is what makes "late"
  # observable — which is also why it belongs in the repository's required checks and not only
  # in the run list.
  #
  # Both halves of it are now one step. Six repositories carried a hand-written variant of this
  # check and disagreed on the thing that matters most — how to cut the generated `LABEL` block
  # back out of a Dockerfile — so the checking lives in `rust/config-contract` and `justfile`
  # holds the writing. The two cannot drift apart, because neither one is a second opinion about
  # the other: the action renders and compares, `just regenerate` renders and writes.
  contract:
    name: Config Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      # One render, both comparisons: the committed `docs/config.contract.json` and the
      # Dockerfile's `terrace-config:labels` region, cut at the markers rather than by line
      # count. `image` is empty, so the two checks that need a built image are skipped and this
      # job stays the cheap half — the labels an image actually carries are a question for a job
      # that has one.
      - name: Verify the configuration contract
        uses: TimSchoenle/actions/actions/rust/config-contract@99c83581b3486a8a9f28e43226b8f02025fcdf9a # tag=actions-rust-config-contract-v1.1.0
        with:
          package: portfolio-config
          features: config-schema
          image: ''

  # The same arrangement as `contract` above, for the other generated document. Update Files
  # renders `README.md` on a pull request and commits it back to the branch; this re-renders it
  # from the same two payloads and fails when the committed file differs, so a README edited by
  # hand cannot merge and a template change cannot merge without its output.
  #
  # It lives here rather than in Update Files because that workflow only runs on `pull_request`,
  # and a gate that never sees `main` is not a gate. The convergence and the refusal are two jobs
  # on purpose: that one makes the branch right, this one declines to let it merge before it is.
  readme:
    name: README
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      # The two steps Update Files runs, with the same inputs. `branch` is the default branch in
      # both places: left at its `github.ref_name` default it would be `<number>/merge` on a pull
      # request and `main` here, and the badge URLs alone would then fail every merge.
      - name: Generate the configuration payload
        id: config-schema
        run: |
          set -euo pipefail
          variables="$(cargo run -q -p portfolio-config --features config-schema \
            --example config-schema -- --format variables)"
          echo "variables=${variables}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: readme-variables
        uses: TimSchoenle/actions/actions/common/readme-variables@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-common-readme-variables-v1.1.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config-schema.outputs.variables }}

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@3b7d152374ee63e720e7c16bed8b088b40554911 # tag=actions-common-render-template-v1.1.1
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.readme-variables.outputs.variables }}
          check: 'true'

  # The documentation gate. `missing_docs` and the clippy doc lints are compiled by `check` and
  # `clippy` already; the rustdoc lints in `[workspace.lints.rustdoc]` are not, because rustdoc is
  # the only thing that runs them. A broken intra-doc link renders as the literal text on the page,
  # so it is invisible to the reader and visible only to whoever no longer needs it. That is why it
  # is denied, and why this job exists as its own step rather than as a flag on an existing one.
  #
  # `--workspace` matters: the workspace root is a package too, so the default member set is that
  # placeholder alone and every crate this repository actually ships would go unchecked.
  doc:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    env:
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Build the documentation
        run: cargo doc --workspace --all-features --no-deps

      # `apps/web` compiles under two mutually exclusive platform features and `--all-features`
      # renders both, so a link that only resolves when the server feature is on never fails the
      # run above. This is the shape the wasm client is actually built in.
      - name: Build the documentation without the server feature
        run: cargo doc -p web --no-default-features --features web --no-deps

      - name: Run the doctests
        run: cargo test --workspace --doc --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@c6844b562767b6e68fff4d39bdf9eced6e29b318 # tag=actions-rust-test-v1.1.1

  fmt:
    name: Auto Format
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Auto Format
        uses: TimSchoenle/actions/actions/rust/auto-format@bde85524c019be605fa345f4203c4a37b68f1336 # tag=actions-rust-auto-format-v1.1.11
        with:
          bot_app_id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          bot_private_key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@dcfb46a6a17ad8565db74057ce60278953056ad5 # tag=actions-rust-clippy-v1.1.9

  docker-build-test:
    name: Docker Build and Test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      # Report every architecture's failures in one run rather than cancelling
      # the sibling leg on the first error.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docker-${{ matrix.arch }}
      cancel-in-progress: true
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
      pull-requests: write # Required to comment on PRs with image size
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Not needed to *build* the foreign image — the Dockerfile cross-compiles
      # from $BUILDPLATFORM — but the smoke test below actually boots it, and
      # running an aarch64 binary on an x86_64 runner needs binfmt_misc.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          # Single platform per matrix leg: the docker exporter (`load: true`)
          # cannot load a multi-platform result, and one image per leg is what
          # the smoke/structure tests operate on. The release workflow builds
          # the same platforms together into one manifest list.
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: image:test
          # The update-repos step regenerates repos.json from the GitHub API
          # during the Docker build; the token lifts the API rate limit.
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          # Scoped per architecture so the two legs do not evict each other's
          # cache — most layers are $BUILDPLATFORM-native and identical, but the
          # target-specific compile steps are not.
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      # Guards against the cross-compile silently degrading into a native build:
      # without this, an image whose binary is x86_64 would still pass every
      # test below on an x86_64 runner and only fail on real arm64 hardware.
      - name: Verify image architecture
        env:
          WANT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          got=$(docker image inspect image:test --format '{{.Architecture}}')
          if [ "$got" != "$WANT_ARCH" ]; then
            echo "::error::image architecture is '$got', expected '$WANT_ARCH'"
            exit 1
          fi
          echo "ok: image architecture is $got"

      - name: Test Docker image serves expected endpoints
        run: |
          set -uo pipefail

          # Boot the freshly built image as a detached container.
          docker run -d --rm --name portfolio-test -p 8080:8080 image:test

          # Always surface the container's logs and tear it down, no matter how
          # the assertions below exit.
          cleanup() {
            echo "::group::portfolio-test container logs"
            docker logs portfolio-test || true
            echo "::endgroup::"
            docker stop portfolio-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          base="http://localhost:8080"

          # ── Readiness gate: wait until the server answers its health probe ────
          # Generous enough for the foreign-architecture leg, where the whole
          # server runs under QEMU user-mode emulation and starts noticeably
          # slower than the native one.
          timeout=60
          ready=0
          for _ in $(seq 1 "$timeout"); do
            if curl -fsS "$base/api/health" >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::container did not become healthy within ${timeout}s"
            exit 1
          fi

          fail=0

          # Assert a GET returns the expected HTTP status code.
          expect_status() {
            local path="$1" want="$2" got
            got=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            if [ "$got" = "$want" ]; then
              echo "ok: GET $path -> HTTP $got"
            else
              echo "::error::GET $path expected HTTP $want, got $got"
              fail=1
            fi
          }

          # Assert the response body for a GET contains a substring.
          #
          # Matches with a here-string rather than `printf … | grep` on purpose:
          # under `set -o pipefail`, `grep -q` exits as soon as it finds the
          # needle, and the still-writing `printf` then takes a SIGPIPE whose
          # non-zero status would poison the pipeline and turn a real match into
          # a spurious "did not contain" (larger bodies like the home page hit
          # this every time). A here-string feeds grep directly, so the exit
          # status is grep's alone.
          expect_body_contains() {
            local path="$1" needle="$2" body
            body=$(curl -fsS "$base$path" 2>/dev/null || true)
            if grep -qF -- "$needle" <<<"$body"; then
              echo "ok: GET $path body contains '$needle'"
            else
              echo "::error::GET $path body did not contain '$needle'"
              fail=1
            fi
          }

          # Assert a response header equals an expected value (case-insensitive name).
          expect_header() {
            local path="$1" name="$2" want="$3" got
            got=$(curl -fsS -D - -o /dev/null "$base$path" 2>/dev/null \
              | tr -d '\r' \
              | awk -F': ' -v h="$name" 'tolower($1)==tolower(h){print $2; exit}')
            if [ "$got" = "$want" ]; then
              echo "ok: GET $path header '$name: $got'"
            else
              echo "::error::GET $path header '$name' expected '$want', got '$got'"
              fail=1
            fi
          }

          # ── Health endpoint reports healthy and is never cached ───────────────
          expect_status /api/health 200
          expect_body_contains /api/health '"status":"healthy"'
          expect_header /api/health cache-control no-store

          # ── Profile API returns the document with the long-lived TTL ──────────
          expect_status /api/v1/profile 200
          expect_body_contains /api/v1/profile '"email"'
          expect_header /api/v1/profile cache-control 'public, max-age=3600'

          # ── Profile JSON Schema endpoint ──────────────────────────────────────
          expect_status /api/v1/profile/schema 200
          expect_body_contains /api/v1/profile/schema '"type":"object"'

          # ── SPA: root and unknown client routes both serve index.html ─────────
          expect_status / 200
          expect_body_contains / '<html'
          expect_status /some/client/route 200
          expect_body_contains /some/client/route '<html'

          # ── Pages declare their language server-side ──────────────────────────
          # The `lang` attribute is stamped onto the SSR response, so it must be
          # in the bytes a crawler receives — not applied after hydration. Sent
          # without an Accept header on purpose: the negotiation must not depend
          # on the client advertising text/html.
          expect_body_contains / '<html lang="en"'
          expect_body_contains /some/client/route '<html lang="en"'

          # German is negotiated from Accept-Language, and the response says so.
          de_page=$(curl -fsS -H 'Accept-Language: de-DE,de' "$base/" || true)
          if grep -qF -- '<html lang="de"' <<<"$de_page"; then
            echo "ok: Accept-Language: de renders <html lang=\"de\">"
          else
            echo '::error::Accept-Language: de did not render <html lang="de">'
            fail=1
          fi

          # ── Language-dependent pages tell shared caches what they vary on ─────
          expect_header / vary 'accept-language, cookie'

          # ── Server-generated documents and embedded assets are served ─────────
          expect_status /robots.txt 200
          expect_status /favicon.svg 200

          # ── The attribution page carries a real inventory ─────────────────────
          # The one way this part of the pipeline fails quietly: `cargo about`
          # did not run, or its output never reached `build.rs`, and the route
          # answers 200 anyway — with the "nothing to show" state in place of the
          # licences the image is obliged to publish. So assert a licence text and
          # a crate name, not just the status.
          expect_status /licenses 200
          expect_body_contains /licenses 'Permission is hereby granted, free of charge'
          expect_body_contains /licenses 'MIT License'

          # ── The social card is a raster, and it is actually in the image ──────
          # `og:image` pointed at the SVG favicon for a while, which every
          # unfurler refuses; the tag looked correct and produced no preview
          # anywhere. Asserting the bytes, not just the tag.
          expect_status /og-image.png 200
          expect_header /og-image.png content-type image/png
          expect_body_contains / '<meta content="image/png" property="og:image:type"/>'

          # ── Content-hashed assets are cached forever ──────────────────────────
          # dx renders the asset hash as plain hex, so it comes out 15 digits
          # about as often as 16. A cache rule that assumed 16 served the wasm
          # binary and the stylesheet — the two largest files on the page —
          # `no-cache` on every visit, which nothing else here would notice.
          bundle=$(grep -oE '/\./assets/web-dxh[0-9a-f]+\.js' <<<"$(curl -fsS "$base/" || true)" \
            | head -1 | sed 's|^/\.||')
          if [ -n "$bundle" ]; then
            expect_header "$bundle" cache-control 'public, max-age=31536000, immutable'
          else
            echo "::error::no hashed client bundle referenced by the served page"
            fail=1
          fi

          # ── Embedded assets carry a validator ─────────────────────────────────
          # Their TTL is the only thing keeping them off the wire; without an
          # ETag every lapsed TTL re-sends the whole body instead of a 304.
          favicon_etag=$(curl -fsS -D - -o /dev/null "$base/favicon.svg" 2>/dev/null \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="etag"{print $2; exit}')
          if [ -n "$favicon_etag" ]; then
            got=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "If-None-Match: $favicon_etag" "$base/favicon.svg")
            if [ "$got" = "304" ]; then
              echo "ok: an unchanged embedded asset revalidates to 304"
            else
              echo "::error::conditional GET /favicon.svg returned $got, expected 304"
              fail=1
            fi
          else
            echo "::error::/favicon.svg carried no ETag"
            fail=1
          fi

          # An SVG is markup. tower-http's default compression predicate skips
          # everything under `image/`, which took the favicon with it.
          svg_encoding=$(curl -fsS -D - -o /dev/null -H 'Accept-Encoding: gzip' \
            "$base/favicon.svg" 2>/dev/null \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="content-encoding"{print $2; exit}')
          if [ -n "$svg_encoding" ]; then
            echo "ok: the SVG favicon is compressed ($svg_encoding)"
          else
            echo "::error::/favicon.svg was served uncompressed"
            fail=1
          fi

          # ── Security headers are applied to every response ────────────────────
          expect_header / x-content-type-options nosniff
          expect_header / x-frame-options DENY
          expect_header / referrer-policy no-referrer

          # ── The Content-Security-Policy is derived from the page it protects ──
          # This is the only place the real bundle is served, and the failure it
          # catches is silent everywhere else: `'unsafe-inline'` is gone from
          # script-src, so an inline script the scanner never saw is refused by
          # the browser and the page renders blank with a console message nobody
          # is watching.
          csp_of() {
            curl -fsS -D - -o /dev/null "$base$1" 2>/dev/null \
              | tr -d '\r' \
              | awk -F': ' 'tolower($1)=="content-security-policy"{print $2; exit}'
          }

          page_csp=$(csp_of /)
          page_html=$(curl -fsS "$base/" || true)
          # Bare `<script>`: the renderer's own inline scripts. The wasm bootstrap
          # is `<script type="module" src=…>` and needs no hash — `'self'` covers it.
          inline_scripts=$(grep -oF '<script>' <<<"$page_html" | wc -l | tr -d ' ')
          page_hashes=$(grep -oF "'sha256-" <<<"$page_csp" | wc -l | tr -d ' ')
          if [ "$inline_scripts" -gt 0 ] && [ "$page_hashes" = "$inline_scripts" ]; then
            echo "ok: all $inline_scripts inline scripts on / are covered by a hash"
          else
            echo "::error::/ carries $inline_scripts inline scripts but $page_hashes hashes; a browser will refuse the difference"
            fail=1
          fi

          # `'unsafe-inline'` must be gone from script-src. style-src keeps it,
          # so the check is on that directive alone rather than on the header.
          script_src=$(tr ';' '\n' <<<"$page_csp" | grep -F 'script-src' || true)
          case "$script_src" in
            *"'unsafe-inline'"*)
              echo "::error::script-src still admits all inline script:$script_src"
              fail=1
              ;;
            *) echo "ok: script-src admits no blanket inline script" ;;
          esac

          # Cloudflare copies this nonce onto the script it injects at the edge.
          # Minted per response, and never cached — one served twice is pinned
          # across every reader, which is `'unsafe-inline'` with extra steps.
          first_nonce=$(grep -o "'nonce-[^']*'" <<<"$page_csp" || true)
          second_nonce=$(grep -o "'nonce-[^']*'" <<<"$(csp_of /)" || true)
          if [ -n "$first_nonce" ] && [ "$first_nonce" != "$second_nonce" ]; then
            echo "ok: script-src carries a nonce, freshly minted per response"
          else
            echo "::error::expected a per-response nonce, got '$first_nonce' then '$second_nonce'"
            fail=1
          fi
          expect_header / cache-control no-cache

          # Anything that is not a document has no inline script to admit, and
          # gets the policy that admits none.
          asset_csp=$(csp_of /favicon.svg)
          case "$asset_csp" in
            "")
              echo "::error::/favicon.svg carried no Content-Security-Policy"
              fail=1
              ;;
            *"sha256-"* | *"nonce-"*)
              echo "::error::a subresource carried a document policy: $asset_csp"
              fail=1
              ;;
            *) echo "ok: subresources carry the policy with no inline-script allowance" ;;
          esac

          if [ "$fail" != "0" ]; then
            echo "::error::container functional smoke tests failed"
            exit 1
          fi
          echo "All container functional smoke tests passed."

      - name: Run structure tests
        run: |
          docker pull gcr.io/gcp-runtimes/container-structure-test:latest
          docker run --rm \
            -v $PWD/cst.yaml:/cst.yaml \
            -v /var/run/docker.sock:/var/run/docker.sock \
            gcr.io/gcp-runtimes/container-structure-test:latest test \
            --image image:test --config /cst.yaml

      - name: Check image size
        id: size-check
        run: |
          SIZE=$(docker image inspect image:test --format='{{.Size}}' | awk '{print int($1/1024/1024)}')
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "Image size: ${SIZE}MB"
          if [ $SIZE -gt 150 ]; then
            echo "::warning::Image size (${SIZE}MB) exceeds 150MB threshold"
          fi

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: image:test
          format: 'sarif'
          output: 'trivy-results-${{ matrix.arch }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.arch }}.sarif'
          # Distinct category per architecture; code scanning treats each upload
          # for the same category as a full replacement, so sharing one would
          # make the two legs erase each other's findings.
          category: trivy-${{ matrix.arch }}

      # One comment per architecture, updated in place on every push instead of
      # appending a new one. The marker is what makes it findable again; the
      # matrix leg owns only its own comment, so the parallel legs never race.
      - name: Comment image size on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        env:
          SIZE: ${{ steps.size-check.outputs.size }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        with:
          script: |
            const { SIZE, ARCH, PLATFORM } = process.env;
            const marker = `<!-- docker-image-size:${ARCH} -->`;
            const body = `${marker}\n🐳 Docker image size (\`${PLATFORM}\`): **${SIZE}MB**`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
