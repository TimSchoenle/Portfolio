name: Build

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@88e964d440835fd99f7e9d17b4ba1b48544303ba # tag=actions-rust-cargo-check-v1.1.7

  # The committed contract is what a deployment pipeline reads to check that what a chart renders
  # is what this image loads, so it has to be the contract these types produce. Regenerating and
  # diffing makes a configuration change visible in the pull request that makes it: a removed key
  # shows up in the diff, next to the chart it is about to break.
  #
  # The gate stays now that `update-files.yaml` regenerates the contract and commits it: the two
  # answer different questions. The Dockerfile's label region is never written by a bot, so for
  # that half this gate is the only check, and `just regenerate` locally is the fix. That workflow makes a pull request converge on the contract
  # its types produce; this one refuses to let one merge before it has. A copy that arrives a
  # commit late is a gate passing against the wrong document, and this job is what makes "late"
  # observable — which is also why it belongs in the repository's required checks and not only
  # in the run list.
  #
  # Both halves of it are now one step. Six repositories carried a hand-written variant of this
  # check and disagreed on the thing that matters most — how to cut the generated `LABEL` block
  # back out of a Dockerfile — so the checking lives in `rust/config-contract` and `justfile`
  # holds the writing. The two cannot drift apart, because neither one is a second opinion about
  # the other: the action renders and compares, `just regenerate` renders and writes.
  contract:
    name: Config Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # One render, both comparisons: the committed `docs/config.contract.json` and the
      # Dockerfile's `terrace-config:labels` region, cut at the markers rather than by line
      # count. `image` is empty, so the two checks that need a built image are skipped and this
      # job stays the cheap half — the labels an image actually carries are a question for a job
      # that has one.
      - name: Verify the configuration contract
        uses: TimSchoenle/actions/actions/rust/config-contract@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-config-contract-v1.4.0
        with:
          package: portfolio-config
          features: config-schema
          image: ''

  # The same arrangement as `contract` above, for the other generated document. Update Files
  # renders `README.md` on a pull request and commits it back to the branch; this re-renders it
  # from the same two payloads and fails when the committed file differs, so a README edited by
  # hand cannot merge and a template change cannot merge without its output.
  #
  # It lives here rather than in Update Files because that workflow only runs on `pull_request`,
  # and a gate that never sees `main` is not a gate. The convergence and the refusal are two jobs
  # on purpose: that one makes the branch right, this one declines to let it merge before it is.
  readme:
    name: README
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # The two steps Update Files runs, with the same inputs. `branch` is the default branch in
      # both places: left at its `github.ref_name` default it would be `<number>/merge` on a pull
      # request and `main` here, and the badge URLs alone would then fail every merge.
      - name: Generate the configuration payload
        id: config-schema
        run: |
          set -euo pipefail
          variables="$(cargo run -q -p portfolio-config --features config-schema \
            --example config-schema -- --format variables)"
          echo "variables=${variables}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: readme-variables
        uses: TimSchoenle/actions/actions/common/readme-variables@7fad0f1921ffec7dc6eda32e8fb07c9bd4688624 # tag=actions-common-readme-variables-v2.0.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config-schema.outputs.variables }}

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@495fd50fd4a5ae3d9fb1496c96eada74c6f2529a # tag=actions-common-render-template-v3.0.0
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.readme-variables.outputs.variables }}
          check: 'true'

      # The budgets PROSE.md and the doc-comment GUIDE.md define as mechanical: banned doc-comment
      # openers across the workspace, and the em-dash and bold-frame counts of the README. It runs
      # after a failed render too, so one push reports both.
      - name: Check the prose budgets
        if: success() || failure()
        run: bash scripts/prose-check.sh README.md

  # The documentation gate. `missing_docs` and the clippy doc lints are compiled by `check` and
  # `clippy` already; the rustdoc lints in `[workspace.lints.rustdoc]` are not, because rustdoc is
  # the only thing that runs them. A broken intra-doc link renders as the literal text on the page,
  # so it is invisible to the reader and visible only to whoever no longer needs it. That is why it
  # is denied, and why this job exists as its own step rather than as a flag on an existing one.
  #
  # `--workspace` matters: the workspace root is a package too, so the default member set is that
  # placeholder alone and every crate this repository actually ships would go unchecked.
  doc:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    env:
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Build the documentation
        run: cargo doc --workspace --all-features --no-deps

      # `apps/web` compiles under two mutually exclusive platform features and `--all-features`
      # renders both, so a link that only resolves when the server feature is on never fails the
      # run above. This is the shape the wasm client is actually built in.
      - name: Build the documentation without the server feature
        run: cargo doc -p web --no-default-features --features web --no-deps

      - name: Run the doctests
        run: cargo test --workspace --doc --all-features

  # Kept apart from `test`, so a Codecov outage fails this job alone. The upload authenticates
  # with this job's OIDC token, so the job needs no environment and no secret.
  # `.github/codecov.yml` decides what the Codecov statuses check.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required to authenticate the Codecov upload with OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Coverage
        uses: TimSchoenle/actions/actions/rust/coverage-codecov@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-rust-coverage-codecov-v2.0.4
        with:
          test_arguments: '--workspace --all-features'
          flags: rust

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-test-v1.1.2

  # Auto-format comes in two halves, like the jobs in `update-files.yaml`. `cargo fmt` runs the
  # toolchain `rust-toolchain.toml` names and honours any `rustfmt.toml`, both of which the pull
  # request controls, so the half that runs it holds no secret and a read-only `GITHUB_TOKEN` and
  # hands on only a patch artifact. The second half, in the `ci` environment, mints the maintenance App's
  # token and commits that patch; it runs nothing from the checkout, and `allowed_paths` refuses any
  # path that is not Rust source.
  #
  # Pull requests only: the patch is committed to the pull request's branch, and a push to `main`
  # has none. Code reaches `main` through a pull request that already went through this.
  fmt:
    name: Auto Format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    outputs:
      changes_detected: ${{ steps.format.outputs.changes_detected }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The pull request head, not the default merge commit: the patch is committed to the branch,
      # so it has to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Auto Format
        id: format
        uses: TimSchoenle/actions/actions/rust/auto-format@495fd50fd4a5ae3d9fb1496c96eada74c6f2529a # tag=actions-rust-auto-format-v2.0.0
        with:
          artifact_name: rust-auto-format

  fmt-commit:
    name: Commit Format
    needs: fmt
    # A fork's pull request gets no secrets, and its branch is not in this repository.
    if: >-
      github.event_name == 'pull_request' &&
      needs.fmt.outputs.changes_detected == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to fetch the commit the patch applies to
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # Required to commit the patch to the pull request's branch

      # The artifact name is a literal, not the format job's output: that job ran the pull
      # request's code.
      - name: Commit Format
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          artifact_name: rust-auto-format
          # Rust sources only: the only files `cargo fmt` rewrites. Any other path fails this job.
          allowed_paths: '**/*.rs'
          commit_message: 'style: auto-format rust code'

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The shared action only annotates findings; `-D warnings` is what fails the job on them.
      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-clippy-v1.1.13
        with:
          clippy_arguments: '--all-features --all-targets -- -D warnings'

  # `--all-features` turns the web app's `web` and `server` platforms on together, which compiles
  # out every `cfg(all(feature = "web", not(feature = "server")))` item — the wasm client's
  # language detection, `dioxus::launch`. Each platform is linted here the way it is built.
  clippy-platforms:
    name: Clippy (web platforms)
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: wasm32-unknown-unknown
          components: clippy

      - name: Clippy, server only
        run: cargo clippy -p web --no-default-features --features server --all-targets -- -D warnings

      - name: Clippy, wasm client only
        run: cargo clippy -p web --no-default-features --features web --target wasm32-unknown-unknown -- -D warnings

  docker-build-test:
    name: Docker Build and Test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      # Report every architecture's failures in one run rather than canceling
      # the sibling leg on the first error.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docker-${{ matrix.arch }}
      cancel-in-progress: true
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Not needed to *build* the foreign image — the Dockerfile cross-compiles
      # from $BUILDPLATFORM — but the smoke test below actually boots it, and
      # running an aarch64 binary on an x86_64 runner needs binfmt_misc.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The Dockerfile keeps one BuildKit cache mount, the fetched repos.json; compiled
      # dependencies are cooked layers, which `cache-to` carries. `cache-to: type=gha` exports
      # layers only, never cache mounts, so on an ephemeral runner the mount would start empty
      # every time and the repos freshness check could never hit. These steps restore the mount
      # before the build and save it after it.
      #
      # Only pushes to `main` save. A pull request restores `main`'s entry and builds on it; an
      # entry it saved would be readable by later runs of that pull request alone, and would
      # count against the 10 GB cache quota that holds `main`'s entries. `actions/cache/restore`
      # has no post step, and `skip-extraction` drops the copy-out that would only feed it.
      - name: Restore and save the BuildKit cache mounts
        if: github.event_name == 'push'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: buildkit-cache-mounts
          key: buildkit-mounts-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            buildkit-mounts-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-
            buildkit-mounts-${{ matrix.arch }}-

      - name: Restore the BuildKit cache mounts
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: buildkit-cache-mounts
          key: buildkit-mounts-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            buildkit-mounts-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-
            buildkit-mounts-${{ matrix.arch }}-

      - name: Inject the cache mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          dockerfile: Dockerfile
          cache-dir: buildkit-cache-mounts
          skip-extraction: ${{ github.event_name != 'push' }}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # Single platform per matrix leg: the docker exporter (`load: true`)
          # cannot load a multi-platform result, and one image per leg is what
          # the smoke/structure tests operate on. The release workflow builds
          # the same platforms together into one manifest list.
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: image:test
          # The update-repos step regenerates repos.json from the GitHub API
          # during the Docker build; the token lifts the API rate limit.
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          # Scoped per architecture so the two legs do not evict each other's
          # cache — most layers are $BUILDPLATFORM-native and identical, but the
          # target-specific compile steps are not.
          #
          # Every run reads the cache; only pushes to `main` write it. A pull
          # request's export lands under its own ref, which `main` and the release
          # build never read, yet it counts against the repository's 10 GB cache
          # quota and evicts `main`'s blobs: `main` runs logged
          # `blob sha256:…: not found` after importing the manifest and rebuilt
          # stages their commit had not touched.
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=docker-{0}', matrix.arch) || '' }}

      # Guards against the cross-compile silently degrading into a native build:
      # without this, an image whose binary is x86_64 would still pass every
      # test below on an x86_64 runner and only fail on real arm64 hardware.
      - name: Verify image architecture
        env:
          WANT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          got=$(docker image inspect image:test --format '{{.Architecture}}')
          if [ "$got" != "$WANT_ARCH" ]; then
            echo "::error::image architecture is '$got', expected '$WANT_ARCH'"
            exit 1
          fi
          echo "ok: image architecture is $got"

      # Boots the image against the legal templates and checks every route and header contract.
      # The script is what `just smoke` runs locally, so a failure here reproduces off CI.
      - name: Test Docker image serves expected endpoints
        run: bash scripts/smoke-test.sh image:test

      # Only a browser sees hydration: a CSP refusal, a wasm panic, or a client hydrating in a
      # different language than the server rendered. amd64 only, where Chromium runs natively.
      - name: Start the image for the browser test
        if: matrix.arch == 'amd64'
        run: |
          docker run -d --rm --name portfolio-browser -p 8080:8080 \
            -v "$PWD/legal:/config/legal:ro" -e PORTFOLIO_CONFIG=/config/legal image:test
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::container did not become healthy within 60s"
          exit 1

      - name: Set up Node
        if: matrix.arch == 'amd64'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Browser smoke test
        if: matrix.arch == 'amd64'
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node smoke.mjs http://localhost:8080

      - name: Stop the browser test container
        if: always() && matrix.arch == 'amd64'
        run: |
          docker logs portfolio-browser 2>&1 | tail -50 || true
          docker stop portfolio-browser >/dev/null 2>&1 || true

      - name: Run structure tests
        env:
          # Pinned by digest like every other input; the tag alone is mutable.
          # renovate: datasource=docker depName=gcr.io/gcp-runtimes/container-structure-test
          CST_IMAGE: gcr.io/gcp-runtimes/container-structure-test:latest@sha256:377f9a9bc00376b9fa6dc6a3a020dbe40e84ebe9481b71969aa3ff9d1c9ea17e
        run: |
          docker run --rm \
            -v "$PWD/cst.yaml:/cst.yaml" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$CST_IMAGE" test \
            --image image:test --config /cst.yaml

      # Size against the 150 MiB warning, a Trivy scan at CRITICAL,HIGH, the SARIF upload and the
      # pull request report, in one step. `comment: summary` because a leg can only own its own
      # comment: it uploads a fragment instead, and `image-size-report` below folds every leg into
      # one table. `sarif-category` keeps the per-architecture category the inline upload used —
      # code scanning treats each upload for a category as a full replacement, so the two legs
      # must not share one, and a new name would orphan the alerts filed under the old.
      - name: Check Docker image
        uses: TimSchoenle/actions/actions/docker/image-check@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-docker-image-check-v1.1.8
        with:
          image: image:test
          platform: ${{ matrix.platform }}
          sarif-category: trivy-${{ matrix.arch }}
          comment: summary

  # One comment for every architecture, rewritten in place on each push, built from the fragments
  # the `docker-build-test` legs uploaded. A job of its own because no leg can see the others'
  # results, and `always()` so a leg that failed costs the table its own row, not everyone's.
  # Reporting only: it gates nothing, so a missing row is never a red check on the pull request.
  image-size-report:
    name: Image Size Report
    runs-on: ubuntu-latest
    needs: docker-build-test
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read # Required by docker/image-check-summary
      pull-requests: write # Required to comment on PRs with image size
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Comment image sizes on PR
