name: Build

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@5798c7bd8d1d98a0c7360114e91a0ac3b86bf145 # tag=actions-rust-cargo-check-v1.1.5

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@c6844b562767b6e68fff4d39bdf9eced6e29b318 # tag=actions-rust-test-v1.1.1

  fmt:
    name: Auto Format
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Auto Format
        uses: TimSchoenle/actions/actions/rust/auto-format@cf09acb4d66f357e85f979c9abf3442918a865a0 # tag=actions-rust-auto-format-v1.1.9
        with:
          bot_app_id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          bot_private_key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@dcfb46a6a17ad8565db74057ce60278953056ad5 # tag=actions-rust-clippy-v1.1.9

  docker-build-test:
    name: Docker Build and Test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      # Report every architecture's failures in one run rather than cancelling
      # the sibling leg on the first error.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docker-${{ matrix.arch }}
      cancel-in-progress: true
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
      pull-requests: write # Required to comment on PRs with image size
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Not needed to *build* the foreign image — the Dockerfile cross-compiles
      # from $BUILDPLATFORM — but the smoke test below actually boots it, and
      # running an aarch64 binary on an x86_64 runner needs binfmt_misc.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          # Single platform per matrix leg: the docker exporter (`load: true`)
          # cannot load a multi-platform result, and one image per leg is what
          # the smoke/structure tests operate on. The release workflow builds
          # the same platforms together into one manifest list.
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: image:test
          # The update-repos step regenerates repos.json from the GitHub API
          # during the Docker build; the token lifts the API rate limit.
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          # Scoped per architecture so the two legs do not evict each other's
          # cache — most layers are $BUILDPLATFORM-native and identical, but the
          # target-specific compile steps are not.
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      # Guards against the cross-compile silently degrading into a native build:
      # without this, an image whose binary is x86_64 would still pass every
      # test below on an x86_64 runner and only fail on real arm64 hardware.
      - name: Verify image architecture
        env:
          WANT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          got=$(docker image inspect image:test --format '{{.Architecture}}')
          if [ "$got" != "$WANT_ARCH" ]; then
            echo "::error::image architecture is '$got', expected '$WANT_ARCH'"
            exit 1
          fi
          echo "ok: image architecture is $got"

      - name: Test Docker image serves expected endpoints
        run: |
          set -uo pipefail

          # Boot the freshly built image as a detached container.
          docker run -d --rm --name portfolio-test -p 8080:8080 image:test

          # Always surface the container's logs and tear it down, no matter how
          # the assertions below exit.
          cleanup() {
            echo "::group::portfolio-test container logs"
            docker logs portfolio-test || true
            echo "::endgroup::"
            docker stop portfolio-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          base="http://localhost:8080"

          # ── Readiness gate: wait until the server answers its health probe ────
          # Generous enough for the foreign-architecture leg, where the whole
          # server runs under QEMU user-mode emulation and starts noticeably
          # slower than the native one.
          timeout=60
          ready=0
          for _ in $(seq 1 "$timeout"); do
            if curl -fsS "$base/api/health" >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::container did not become healthy within ${timeout}s"
            exit 1
          fi

          fail=0

          # Assert a GET returns the expected HTTP status code.
          expect_status() {
            local path="$1" want="$2" got
            got=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            if [ "$got" = "$want" ]; then
              echo "ok: GET $path -> HTTP $got"
            else
              echo "::error::GET $path expected HTTP $want, got $got"
              fail=1
            fi
          }

          # Assert the response body for a GET contains a substring.
          #
          # Matches with a here-string rather than `printf … | grep` on purpose:
          # under `set -o pipefail`, `grep -q` exits as soon as it finds the
          # needle, and the still-writing `printf` then takes a SIGPIPE whose
          # non-zero status would poison the pipeline and turn a real match into
          # a spurious "did not contain" (larger bodies like the home page hit
          # this every time). A here-string feeds grep directly, so the exit
          # status is grep's alone.
          expect_body_contains() {
            local path="$1" needle="$2" body
            body=$(curl -fsS "$base$path" 2>/dev/null || true)
            if grep -qF -- "$needle" <<<"$body"; then
              echo "ok: GET $path body contains '$needle'"
            else
              echo "::error::GET $path body did not contain '$needle'"
              fail=1
            fi
          }

          # Assert a response header equals an expected value (case-insensitive name).
          expect_header() {
            local path="$1" name="$2" want="$3" got
            got=$(curl -fsS -D - -o /dev/null "$base$path" 2>/dev/null \
              | tr -d '\r' \
              | awk -F': ' -v h="$name" 'tolower($1)==tolower(h){print $2; exit}')
            if [ "$got" = "$want" ]; then
              echo "ok: GET $path header '$name: $got'"
            else
              echo "::error::GET $path header '$name' expected '$want', got '$got'"
              fail=1
            fi
          }

          # ── Health endpoint reports healthy and is never cached ───────────────
          expect_status /api/health 200
          expect_body_contains /api/health '"status":"healthy"'
          expect_header /api/health cache-control no-store

          # ── Profile API returns the document with the long-lived TTL ──────────
          expect_status /api/v1/profile 200
          expect_body_contains /api/v1/profile '"email"'
          expect_header /api/v1/profile cache-control 'public, max-age=3600'

          # ── Profile JSON Schema endpoint ──────────────────────────────────────
          expect_status /api/v1/profile/schema 200
          expect_body_contains /api/v1/profile/schema '"type":"object"'

          # ── SPA: root and unknown client routes both serve index.html ─────────
          expect_status / 200
          expect_body_contains / '<html'
          expect_status /some/client/route 200
          expect_body_contains /some/client/route '<html'

          # ── Server-generated documents and embedded assets are served ─────────
          expect_status /robots.txt 200
          expect_status /favicon.svg 200

          # ── Security headers are applied to every response ────────────────────
          expect_header / x-content-type-options nosniff
          expect_header / x-frame-options DENY
          expect_header / referrer-policy no-referrer

          if [ "$fail" != "0" ]; then
            echo "::error::container functional smoke tests failed"
            exit 1
          fi
          echo "All container functional smoke tests passed."

      - name: Run structure tests
        run: |
          docker pull gcr.io/gcp-runtimes/container-structure-test:latest
          docker run --rm \
            -v $PWD/cst.yaml:/cst.yaml \
            -v /var/run/docker.sock:/var/run/docker.sock \
            gcr.io/gcp-runtimes/container-structure-test:latest test \
            --image image:test --config /cst.yaml

      - name: Check image size
        id: size-check
        run: |
          SIZE=$(docker image inspect image:test --format='{{.Size}}' | awk '{print int($1/1024/1024)}')
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "Image size: ${SIZE}MB"
          if [ $SIZE -gt 150 ]; then
            echo "::warning::Image size (${SIZE}MB) exceeds 150MB threshold"
          fi

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: image:test
          format: 'sarif'
          output: 'trivy-results-${{ matrix.arch }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.arch }}.sarif'
          # Distinct category per architecture; code scanning treats each upload
          # for the same category as a full replacement, so sharing one would
          # make the two legs erase each other's findings.
          category: trivy-${{ matrix.arch }}

      # One comment per architecture, updated in place on every push instead of
      # appending a new one. The marker is what makes it findable again; the
      # matrix leg owns only its own comment, so the parallel legs never race.
      - name: Comment image size on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        env:
          SIZE: ${{ steps.size-check.outputs.size }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        with:
          script: |
            const { SIZE, ARCH, PLATFORM } = process.env;
            const marker = `<!-- docker-image-size:${ARCH} -->`;
            const body = `${marker}\n🐳 Docker image size (\`${PLATFORM}\`): **${SIZE}MB**`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
