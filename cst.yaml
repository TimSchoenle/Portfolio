schemaVersion: 2.0.0

metadataTest:
  entrypoint: [ "/app/server" ]
  exposedPorts: [ '8080' ]
  user: '1001:1001'
  envVars:
    - key: PORT
      value: '8080'
    - key: IP
      value: 0.0.0.0
    - key: RUST_LOG
      value: info
    # ISR is on by default, cached into the writable /tmp mount. The image's
    # only `PORTFOLIO_` default, and a deployment-visible contract: a chart that
    # mounts a volume elsewhere has to override precisely this key.
    - key: PORTFOLIO_ISR__CACHE_DIR
      value: /tmp/isr

fileExistenceTests:
  # ── fullstack SSR server binary (the whole `dx bundle` output copied to /app) ─
  - name: server binary present
    path: /app/server
    shouldExist: true

  # ── dx bundle: the sibling public/ asset dir the server resolves relative to
  # itself. robots.txt, sitemap.xml, site.webmanifest, /favicon.svg and /fonts/
  # are served dynamically by the server (see server/seo.rs + server/assets.rs),
  # so they are NOT files here. The resume PDFs are embedded into the server
  # binary (served at /resume/ from memory), not bundled onto disk, so there is
  # no public/resume directory to assert.
  - name: public directory present
    path: /app/public
    shouldExist: true
  - name: public index.html present
    path: /app/public/index.html
    shouldExist: true

  # The client bundle (wasm loader JS + the wasm binary) is emitted by dx under
  # public/assets/ with content-hashed names (e.g. assets/web-dx<hash>.js), so
  # the individual file names are not predictable; assert the directory instead.
  - name: public assets directory present
    path: /app/public/assets
    shouldExist: true

fileContentTests:
  # The content-hashed manganis asset names are not predictable, but the served
  # index.html always references the dx-injected wasm bundle loader under
  # assets/ (e.g. /./assets/web-dx<hash>.js).
  - name: index.html references the wasm bundle
    path: /app/public/index.html
    expectedContents:
      - 'assets/web-dx[0-9a-z]+\.js'
