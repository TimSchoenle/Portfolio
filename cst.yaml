schemaVersion: 2.0.0

metadataTest:
  entrypoint: [ "/app/server" ]
  exposedPorts: [ '8080' ]
  user: '1001:1001'
  envVars:
    - key: PORT
      value: '8080'
    - key: IP
      value: 0.0.0.0
    - key: RUST_LOG
      value: info

fileExistenceTests:
  # ── fullstack SSR server binary (the whole `dx bundle` output copied to /app) ─
  - name: server binary present
    path: /app/server
    shouldExist: true

  # ── CA certs (from the distroless/cc base) for outbound HTTPS ───────────────
  - name: ca certificates present
    path: /etc/ssl/certs/ca-certificates.crt
    shouldExist: true

  # ── dx bundle: the sibling public/ asset dir the server resolves relative to
  # itself. robots.txt, sitemap.xml, site.webmanifest, /favicon.svg and /fonts/
  # are served dynamically by the server (see server/seo.rs + server/assets.rs),
  # so they are NOT files here.
  - name: public directory present
    path: /app/public
    shouldExist: true
  - name: public index.html present
    path: /app/public/index.html
    shouldExist: true

  # The wasm client bundle emitted by dx at stable, un-hashed paths.
  - name: wasm js bundle present
    path: /app/public/wasm/web.js
    shouldExist: true
  - name: wasm binary present
    path: /app/public/wasm/web_bg.wasm
    shouldExist: true

  # Resume PDFs copied into public/resume by the build and served at /resume/.
  - name: public resume directory present
    path: /app/public/resume
    shouldExist: true

fileContentTests:
  # The content-hashed manganis asset names are not predictable, but the served
  # index.html always references the dx-injected wasm bundle loader.
  - name: index.html references the wasm bundle
    path: /app/public/index.html
    expectedContents:
      - 'wasm/web\.js'
