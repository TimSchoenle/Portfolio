[workspace]
members = [
    "crates/config",
    "crates/data",
    "apps/web",
    "apps/resume-generator",
    "apps/update-repos",
]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2024"
publish = false

# The five fields below `name` are what the README payload action
# (`TimSchoenle/actions/actions/common/readme-variables`) reads. It refuses to
# take the description from the GitHub API on purpose: one edited in the web UI
# would change the rendered README with no commit behind it, and the next
# unrelated pull request would then fail the README drift gate for a reason
# absent from its own diff. The description, the homepage and the licence are
# the same three strings the image's OCI labels carry.
#
# `rust-version` is the toolchain the image is built with — `rust:1.97-slim` in
# the Dockerfile — and not a floor anything tests below.
[package]
name = "portfolio-platform"
version = "2.9.0"
publish = false
edition = "2024"
rust-version = "1.97"
description = "Dioxus fullstack (SSR + hydration) portfolio served by Axum."
homepage = "https://tim-schoenle.de"
license = "LicenseRef-Proprietary"

# Inherited by every member with `[lints] workspace = true`.
#
# `missing_docs` only fires on an effectively-exported item, so it reaches
# `crates/config` and `crates/data` and nothing in `apps/`: all three binaries
# declare their modules privately, which makes every item in them unexported as
# far as the lint is concerned. The rustdoc link lints below do fire inside a
# private module, so the `doc` job still gates the binaries; what is not linted
# there is coverage, and that is a review criterion.
#
# `clippy::missing_docs_in_private_items` is deliberately absent. A private
# helper whose body is six obvious lines has nothing to say; the private
# constant whose value came out of a rate limit has everything to say, and no
# lint tells those apart.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Already inside `pedantic`. Named again so the next reader can see they are
# deliberate rather than swept in with the group.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
too_long_first_doc_paragraph = "warn"
doc_link_with_quotes = "warn"
doc_broken_link = "warn"
doc_include_without_cfg = "warn"

# Denied rather than warned: a broken link renders as the literal text
# ``[`Foo`]`` on the page, so it is invisible to the person reading the rendered
# output and visible only to the person who no longer needs it.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"

[workspace.dependencies]
portfolio-config = { path = "crates/config" }
portfolio-data = { path = "crates/data" }

# The layered configuration loader: struct defaults, then TOML, then
# `PORTFOLIO_`-prefixed environment variables, then a secrets directory, then
# `_FILE` indirection — with a key supplied by two of the last three refused
# rather than silently resolved by precedence. Pinned by tag, not branch, so an
# update to the loader is a deliberate commit here rather than whatever `main`
# happened to be at build time.
#
# `default-features = false`, then back exactly what is used. The crate is six
# features and this workspace takes two of them:
#
# - `loader` is the layering above, and the reason the dependency exists.
# - `explain` is the report `load` cannot give: which layer supplied each key,
#   and which keys more than one supplied. It costs no dependency at all — only
#   the code that walks the layers a second time and renders it — and it is what
#   both binaries print when a configuration is refused, where the error names
#   the key and this names the mount it came from.
#
# `reload` is left out: it is a supervisor that rebuilds a running service when
# its files change, and taking it would link tokio, notify and tracing into
# every consumer for a reload this workspace cannot use — see
# `crates/config/src/lib.rs` for the two reasons.
#
# `schema` and `schema-cli` are left out here and turned on together by
# `portfolio-config`'s own off-by-default `config-schema` feature, so
# `serde_json`, `syn`, the derive and the generator's argument parser reach the
# documentation generator and never a binary this workspace ships.
# `testing` is left out for the same reason and taken as a dev-dependency in
# `crates/config`, which is the only crate that loads anything.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.9.0", default-features = false, features = [
    "loader",
    "explain",
] }
# Keeps the GitHub token out of `Debug` output and off every accidental log
# line: a `SecretString` has no `Display`, and reading it is the explicit
# `expose_secret()` call at the one place it is put on the wire.
secrecy = { version = "0.10", features = ["serde"] }

# Dioxus 0.7 fullstack. `fullstack` enables server functions + hydration
# serialization on both targets; `router` re-exports dioxus-router. The
# `web` (wasm client) and `server` (native SSR) renderers are selected
# per-build by the `apps/web` crate's own feature flags, never here.
dioxus = { version = "0.7.9", features = ["fullstack", "router"] }

# i18nrs Dioxus integration. Only the base component set (`dio`) is enabled.
# `dio-ssr` is deliberately omitted: it wires i18nrs's own cookie negotiation via
# a `#[server]` round-trip (`get_cookie`/`set_cookie`) whose `get_cookie` result
# is discarded upstream. We negotiate the locale ourselves instead —
# synchronously on the server (`crate::i18n::detect_locale`, from request
# headers) and directly from `document.cookie` on the client — so no server
# endpoint is needed for proper SSR i18n.
i18nrs = { version = "0.1.9", features = ["dio"] }

wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "HtmlInputElement",
    "Element",
    "EventListener",
    "KeyboardEvent",
    "MouseEvent",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "DomRect",
    "Navigator",
    "Clipboard",
    "Storage",
    "ScrollIntoViewOptions",
    "ScrollBehavior",
    "DomTokenList",
    "AddEventListenerOptions",
    "WheelEvent",
    # `Element::query_selector_all` returns a `NodeList`; used by the command
    # palette's focus trap to enumerate its focusable children.
    "NodeList",
    # `window.matchMedia("(prefers-reduced-motion: reduce)")` gates the
    # scroll-driven hero motion and reveal entrance animations.
    "MediaQueryList",
    # Client-side `lang` cookie read/write for i18n locale persistence
    # (`HtmlDocument::cookie` / `set_cookie`), replacing i18nrs's server round-trip.
    "HtmlDocument",
] }
gloo-timers = { version = "0.4.0", features = ["futures"] }

# Blocking, pure-Rust HTTP client used by the `update-repos` builder to call the
# GitHub REST API from CI (no async runtime needed for a one-shot fetch).
ureq = { version = "3", features = ["json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

axum = "0.8"
# `util` brings `ServiceExt::oneshot`, used by the server's router-level
# integration tests to dispatch requests through the real `Router`.
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = [
    "fs",
    "trace",
    "set-header",
    "compression-br",
    "compression-gzip",
] }
tracing = "0.1"
# Only reached when `sentry.enabled` is set: the Sentry layer has to be a layer *of* a
# subscriber, and `dioxus_logger::initialize_default` builds one that cannot be extended after
# the fact. So the server builds its own — same `RUST_LOG` contract, same formatter — and does it
# before `dioxus::serve`, which then sees `tracing::dispatcher::has_been_set` and leaves it
# alone. With Sentry off nothing here is constructed and the framework's subscriber stands.
#
# `env-filter` on top of the defaults, which are the `fmt` layer and its ANSI support. Already in
# the lockfile through `dioxus-logger`, so this pulls nothing new into the graph or into
# `THIRD-PARTY-NOTICES`.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error reporting and performance tracing for the SSR server, off unless an operator configures a
# DSN (`apps/web/src/server/telemetry.rs`). One crate rather than three: `sentry` re-exports
# `sentry-tracing` and `sentry-tower` under `sentry::integrations::*`, so the three versions
# cannot drift.
#
# `default-features = false`, then back exactly what is used — and the transport is the part
# worth reading twice.
#
# The default is `transport`, which is `reqwest + native-tls`: `native-tls` links OpenSSL, which
# the `scratch` runtime image ships none of, so the failure would be at exec time in production
# rather than at build time in CI. The obvious replacement is `reqwest` + `rustls`, and it is the
# wrong one here: `sentry` pins reqwest 0.13 while the Dioxus fullstack stack builds 0.12, so it
# would be a *second* async HTTP client — and reqwest 0.13's `rustls` feature means `aws-lc-rs`
# (a cmake/C build, in an image cross-compiled to musl and built for bit-reproducibility) plus
# `rustls-platform-verifier`, which looks for an OS trust store that `scratch` does not have.
#
# `ureq` is the transport that costs nothing. The crate is already in `Cargo.lock` — the
# `update-repos` builder calls the GitHub API with it — and ureq's own `rustls` feature is `ring`
# plus bundled `webpki-roots`, which is exactly the stack the runtime image is built for. It is a
# blocking client, which is not a compromise: the SDK owns a background transport thread and
# never sends on a request path.
#
# The defaults also include `logs`, `metrics` and `release-health` — three separate Sentry
# products this site does not use, and each one an egress channel with no key in the
# configuration reference describing it.
#
# What is on: `backtrace`/`debug-images` (stack traces and the module list that symbolicates
# them), `panic` (the hook that turns a panic into an issue — a panic in a handler unwinds that
# request's task and leaves the process serving, so without this it is invisible), and the two
# integrations: `tracing` for the subscriber layer and `tower-axum-matched-path` for one
# transaction per request named by the matched route rather than by the URI, which is what stops
# `/api/repos/{name}` becoming one transaction name per repository.
#
# `contexts` is deliberately **off**, and it is a default. It adds an OS/host/runtime tag block by
# pulling `os_info`, which carries a fifteen-crate `objc2` tree for its macOS support — into
# `Cargo.lock`, and so into the `/licenses` page, for platforms no image here targets. What it
# would report (kernel version, arch, rustc version) is a constant of the image, which the release
# tag already names.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "debug-images",
    "panic",
    "ureq",
    "rustls",
    "tracing",
    "tower-axum-matched-path",
] }

# The Content-Security-Policy the SSR server sends, built from the document it is
# about to serve rather than from a hand-maintained list of hashes that drifts the
# moment anyone edits the shell. `cloudflare` is the crate's `presets` + `nonce`
# pair: the origins Cloudflare's products load from *and* the directives they have
# to appear in, plus the per-response nonce its edge-injected bot script needs.
#
# Pinned by tag rather than branch, for the same reason as `terrace-config`: the
# policy this site serves changes on a deliberate commit here, not on whatever
# `main` happened to be at build time. Not on crates.io, hence the git source.
#
# Server-only — `apps/web` takes it through `dep:` under its `server` feature. The
# `nonce` feature pulls `getrandom`, which has no default backend on
# `wasm32-unknown-unknown`, and a response header is not something the wasm client
# builds anyway.
csp-shell = { git = "https://github.com/TimSchoenle/csp-shell", tag = "csp-shell-v0.2.0", features = [
    "cloudflare",
] }

# Typst is the resume PDF engine, embedded as a library so the generator stays
# a self-contained `cargo run` (no external binary in CI/Docker). It emits a
# tagged, standard PDF 1.7 with subsetted fonts and live links.
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
# Rasterizes the Open Graph card. Link unfurlers (Facebook, LinkedIn, Slack, X)
# all refuse SVG, so the one social image this site ships has to be a raster —
# and typst is already here, with the brand font embedded and a layout engine,
# so the card is a second tiny document rather than a new toolchain.
typst-render = "0.15"

# The header's QR code. Pure Rust and taken without its default features: the
# `image` and `svg` renderers it ships would pull a decoder stack in for output
# this generator does not use, since the modules are emitted as Typst vectors.
qrcode = { version = "0.14", default-features = false }
sha2 = "0.11"
# Exact-pinned because 0.3.52 changed `Parsable::parse`'s signature, which broke
# `cookie 0.18.1` (pulled transitively via dioxus-fullstack → reqwest →
# cookie_store). Renovate moves this pin forward as compatible releases land, so
# it tracks the newest version that still builds rather than freezing on one.
# Drop the `=` once cookie no longer constrains the choice.
time = { version = "=0.3.55", features = ["formatting", "parsing"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Unwind rather than abort: this profile also builds the SSR server, where a
# panic in one request handler must fail that request, not take the whole
# process (and with it every in-flight request) down. The wasm client is
# unaffected — `wasm32-unknown-unknown` has no unwinding, so panics abort there
# regardless and the bundle keeps its size.
panic = "unwind"
strip = true

# The two build-time generators (`update-repos`, `resume-generator`) run once
# during the image build and are never shipped, so every property `release`
# optimises for is the wrong trade for them: `opt-level = "z"`, fat LTO and a
# single codegen unit buy a smaller binary nobody keeps, at the cost of the
# slowest possible compile of a 296-crate tree (typst).
#
# Measured on `resume-generator` from a cold target directory: 5m03s under
# `release`, 1m29s under this profile — and `opt-level = 1` is the faster of the
# two at *runtime* as well, since typst's layout pass is compute-bound and `z`
# trades speed for size. `inherits = "release"` rather than "dev" so the
# generators still run optimised and with `debug-assertions` off.
[profile.tools]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = true

[lints]
workspace = true
