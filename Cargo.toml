[workspace]
members = [
    "crates/config",
    "crates/data",
    "crates/server",
    "apps/web",
    "apps/resume",
    "apps/update-repos",
]
# Every member, not only the root package. With a root `[package]`, a bare `cargo clippy` or
# `cargo test` otherwise covers the empty root crate alone and nothing a member contains.
default-members = [
    ".",
    "crates/config",
    "crates/data",
    "crates/server",
    "apps/web",
    "apps/resume",
    "apps/update-repos",
]
resolver = "2"

# Inherited by every member. `version` and `license` are left out; docs/DEPENDENCIES.md says why.
[workspace.package]
edition = "2024"
publish = false
rust-version = "1.99"
homepage = "https://tim-schoenle.de"

# The README payload action reads this table alone and does not resolve `.workspace = true`, so
# the inherited values are stated again. `apps/web/tests/toolchain_pins.rs` fails when a copy
# disagrees with `[workspace.package]`, or when `rust-version` disagrees with
# `rust-toolchain.toml` and the Dockerfile's base image.
[package]
name = "portfolio-platform"
version = "3.2.0"
publish = false
edition = "2024"
rust-version = "1.99"
description = "Dioxus fullstack (SSR + hydration) portfolio served by Axum."
homepage = "https://tim-schoenle.de"
license = "LicenseRef-Proprietary"

# Inherited by every member with `[lints] workspace = true`. `missing_docs` reaches only the
# libraries in `crates/`, because the binaries declare their modules privately; the rustdoc link
# lints still gate them.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# A code-quality choice, separate from the documentation gate below.
pedantic = { level = "warn", priority = -1 }
# Named although `pedantic` covers them, so the documentation gate survives without it.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
too_long_first_doc_paragraph = "warn"
doc_link_with_quotes = "warn"
doc_broken_link = "warn"
doc_include_without_cfg = "warn"

# Denied, because a broken link renders as literal ``[`Foo`]`` text nobody reading the page
# notices.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
unescaped_backticks = "warn"

[workspace.dependencies]
portfolio-config = { path = "crates/config" }
portfolio-data = { path = "crates/data" }
portfolio-server = { path = "crates/server" }

# Every dependency below with a reason to exist beyond its name has a section in
# docs/DEPENDENCIES.md, which records the features left out and why.

# The layered configuration loader, pinned by tag so an update is a deliberate commit. Only
# `loader` and `explain` are taken.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.17.0", default-features = false, features = [
    "loader",
    "explain",
] }
# The legal documents as configuration, pinned by tag like `terrace-config` and at a tag that
# resolves to the same loader.
terrace-legal = { git = "https://github.com/TimSchoenle/terrace-legal", tag = "v0.3.4" }
terrace-legal-axum = { git = "https://github.com/TimSchoenle/terrace-legal", tag = "v0.3.4", features = [
    "router",
] }
terrace-legal-dioxus = { git = "https://github.com/TimSchoenle/terrace-legal", tag = "v0.3.4" }
terrace-legal-model = { git = "https://github.com/TimSchoenle/terrace-legal", tag = "v0.3.4" }
# Keeps the GitHub token out of `Debug` output; reading it takes an explicit `expose_secret()`.
secrecy = { version = "0.10", features = ["serde"] }

# The `web` and `server` renderers are selected by `apps/web`'s own features, never here.
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }

# Only `dio`: the site negotiates the locale itself, so `dio-ssr`'s server round-trip is unused.
i18nrs = { version = "0.1.9", features = ["dio"] }

wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "HtmlInputElement",
    "Element",
    "EventListener",
    "KeyboardEvent",
    "MouseEvent",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "DomRect",
    "Navigator",
    "Clipboard",
    "Storage",
    "ScrollIntoViewOptions",
    "ScrollBehavior",
    "DomTokenList",
    "AddEventListenerOptions",
    "WheelEvent",
    # The command palette's focus trap enumerates its focusable children.
    "NodeList",
    # `prefers-reduced-motion` gates the hero motion and the entrance animations.
    "MediaQueryList",
    # The client reads and writes the `lang` cookie directly.
    "HtmlDocument",
] }
gloo-timers = { version = "0.4.0", features = ["futures"] }

# A blocking client is enough for `portfolio-update-repos`'s one-shot fetch, and it is also
# Sentry's transport.
ureq = { version = "3", features = ["json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# Test-only. Default features off: they resolve remote `$ref`s over `reqwest`, and the contract
# has none.
jsonschema = { version = "0.60", default-features = false }

axum = "0.8"
# `util` brings `ServiceExt::oneshot` for the router tests.
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = [
    "fs",
    "trace",
    "set-header",
    "compression-br",
    "compression-gzip",
] }
tracing = "0.1"
# Built only when Sentry is on, as a replacement for the subscriber `dioxus_logger` would
# install. `env-filter` is already in the graph through `dioxus-logger`.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Default features off. The default transport links OpenSSL, which the `scratch` image lacks, so
# the transport is ureq on rustls and ring, already in the graph.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "debug-images",
    "panic",
    "ureq",
    "rustls",
    "tracing",
    "tower-axum-matched-path",
] }

# The Content-Security-Policy built from each served document, pinned by tag. Server-only:
# `nonce` pulls `getrandom`, which has no default backend on `wasm32-unknown-unknown`.
csp-shell = { git = "https://github.com/TimSchoenle/csp-shell", tag = "csp-shell-v0.2.1", features = [
    "cloudflare",
] }

# The resume PDF engine, embedded as a library so the generator needs no external binary.
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
# Rasterizes the Open Graph card, because link unfurlers refuse SVG.
typst-render = "0.15"

# Default features off: the modules are emitted as Typst vectors, so its image renderers are
# unused.
qrcode = { version = "0.14", default-features = false }
sha2 = "0.11"
# Exact-pinned because 0.3.52 broke `cookie 0.18.1`, which dioxus-fullstack pulls in. Renovate
# moves the pin forward; drop the `=` once `cookie` no longer constrains it.
time = { version = "=0.3.55", features = ["formatting", "parsing"] }

# `dx bundle --release` builds through `wasm-release` and its own `server-release`, which both
# inherit this profile.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# A panic in one request handler fails that request instead of the whole server. The wasm client
# aborts regardless, because `wasm32-unknown-unknown` has no unwinding.
panic = "unwind"
strip = true

# The client wasm, declared so `strip = false` holds: an inherited `--strip-all` deletes the
# custom section `wasm-bindgen` runs on next.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = false

# The build-time generators, which are never shipped: a cold `portfolio-resume` build takes 1m29s
# here against 5m03s under `release`, and runs faster too.
[profile.tools]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = true

[lints]
workspace = true
