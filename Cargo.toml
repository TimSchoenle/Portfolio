[workspace]
members = [
    "crates/data",
    "apps/web",
    "apps/resume-generator",
    "apps/update-repos",
]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2024"
publish = false

[package]
name = "portfolio-platform"
version = "2.1.0"
publish = false
edition = "2024"

[workspace.dependencies]
portfolio-data = { path = "crates/data" }

# Dioxus 0.7 fullstack. `fullstack` enables server functions + hydration
# serialization on both targets; `router` re-exports dioxus-router. The
# `web` (wasm client) and `server` (native SSR) renderers are selected
# per-build by the `apps/web` crate's own feature flags, never here.
dioxus = { version = "0.7.9", features = ["fullstack", "router"] }

# i18nrs Dioxus integration. `dio` is the base component set; `dio-ssr` adds the
# server-side cookie-based locale negotiation (pulls dioxus/fullstack + http).
i18nrs = { version = "0.1.9", features = ["dio", "dio-ssr"] }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "HtmlInputElement",
    "Element",
    "EventListener",
    "KeyboardEvent",
    "MouseEvent",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "DomRect",
    "Navigator",
    "Clipboard",
    "Storage",
    "ScrollIntoViewOptions",
    "ScrollBehavior",
    "DomTokenList",
    "AddEventListenerOptions",
] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
gloo-net = "0.7.0"

# Blocking, pure-Rust HTTP client used by the `update-repos` builder to call the
# GitHub REST API from CI (no async runtime needed for a one-shot fetch).
ureq = { version = "3", features = ["json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

axum = "0.8"
# `util` brings `ServiceExt::oneshot`, used by the server's router-level
# integration tests to dispatch requests through the real `Router`.
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = [
    "fs",
    "trace",
    "set-header",
    "compression-br",
    "compression-gzip",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Typst is the resume PDF engine, embedded as a library so the generator stays
# a self-contained `cargo run` (no external binary in CI/Docker). It emits a
# tagged, standard PDF 1.7 with subsetted fonts and live links.
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
sha2 = "0.11"
# Pinned to 0.3.51: 0.3.52 changed `Parsable::parse`'s signature and breaks
# `cookie 0.18.1` (pulled transitively via dioxus-fullstack → reqwest →
# cookie_store). Unpin once cookie ships a 0.3.52-compatible release.
time = { version = "=0.3.51", features = ["formatting", "parsing"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
