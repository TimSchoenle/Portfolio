<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0d14" />

    <!-- Critical paint: set the dark background and color-scheme before any
         stylesheet is parsed, so there is never a flash of white (and native
         UI — scrollbars, form controls — renders dark immediately). -->
    <style>html{background:#0a0d14;color:#e8ecf2;color-scheme:dark}</style>

    <!-- SEO / Open Graph / Twitter / JSON-LD, generated from
         portfolio-data::CONFIG by the `site-meta` pre_build hook (see
         Trunk.toml) and inlined here at build time. -->
    <link data-trunk rel="inline" href="generated/head.html" />

    <!-- Self-hosted fonts: stylesheet and woff2 served from our own origin
         (no fonts.googleapis.com / fonts.gstatic.com requests). The woff2 are
         preloaded so they fetch in parallel with the inlined CSS below; the
         @font-face stylesheet is inlined (root-absolute url()s — see fonts.css). -->
    <link rel="preload" href="/fonts/space-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link data-trunk rel="inline" type="css" href="assets/fonts.css" />
    <link data-trunk rel="copy-dir" href="assets/fonts" />

    <!-- Design system + Tailwind utilities, inlined into the document so the
         single-page app paints without a render-blocking stylesheet request. -->
    <link data-trunk rel="tailwind-css" href="assets/input.css" data-inline />

    <!-- repos.json and resume-fingerprint.json are embedded into the WASM at
         build time (see src/github.rs); only the resume PDFs are served. -->
    <link data-trunk rel="copy-dir" href="generated/resume" />
    <link data-trunk rel="copy-file" href="generated/robots.txt" />
    <link data-trunk rel="copy-file" href="generated/sitemap.xml" />
    <link data-trunk rel="copy-file" href="generated/site.webmanifest" />
    <link data-trunk rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <!-- Stable, unhashed copy of the logo so the masthead can reference it at
         a predictable URL (the icon above is content-hashed by Trunk). -->
    <link data-trunk rel="copy-file" href="assets/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio is a WebAssembly application and needs JavaScript enabled to run.</noscript>
  </body>
</html>
