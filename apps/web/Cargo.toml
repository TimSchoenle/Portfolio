[package]
name = "web"
version = "2.7.0"
edition.workspace = true
publish.workspace = true

[dependencies]
dioxus.workspace = true
portfolio-data.workspace = true
i18nrs.workspace = true
serde.workspace = true
serde_json.workspace = true

# Client-only (wasm). Gated behind the `web` feature so the native SSR binary
# never links wasm-bindgen. Feature lists come from the workspace.
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
# Async delays for the reveal stagger and the contact type-in animation, run on
# the wasm client only.
gloo-timers = { workspace = true, optional = true }

# Server-only (native SSR). Gated behind the `server` feature via `dep:` so they
# never enter the wasm client build. Axum unifies with the version dioxus-server
# re-exports, so layers apply to the router `dioxus::server::router` returns.
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
# Builds the `Content-Security-Policy` from the document being served. Native SSR
# only: it hashes the response body, and its nonce feature needs an OS CSPRNG.
csp-shell = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
time = { workspace = true, features = ["macros"], optional = true }
# Synchronous access to the current request during SSR (for locale negotiation).
# Pinned to the version dioxus-fullstack re-exports.
dioxus-fullstack-core = { version = "=0.7.10", optional = true }
http = { version = "1", optional = true }
# The layered configuration the SSR server boots through. Server-only: the wasm
# client has no filesystem to read a config file or a mounted secret from.
portfolio-config = { workspace = true, optional = true }

[build-dependencies]
# Read at build time so `build.rs` embeds the resume PDFs under their canonical
# `RESUME_FILES` names, keeping the served files in sync with the data crate.
portfolio-data.workspace = true

[dev-dependencies]
# `ServiceExt::oneshot` drives the API router in the server-side integration
# tests; `#[tokio::test]` provides their runtime. Both are only referenced by
# tests compiled under `--features server`.
tower.workspace = true
tokio.workspace = true

[features]
# No platform by default so a bare `cargo check`/`clippy`/`test` over the
# workspace compiles only the shared, renderer-agnostic code — it never builds
# the wasm-only `dioxus/web` renderer on the host. `dx` selects the feature per
# platform; manual checks pass it explicitly:
#
#   cargo check -p web --no-default-features --features server
#   cargo check -p web --no-default-features --features web --target wasm32-unknown-unknown
default = []
web = [
    "dioxus/web",
    "dep:js-sys",
    "dep:web-sys",
    "dep:wasm-bindgen-futures",
    "dep:gloo-timers",
]
server = [
    "dioxus/server",
    # NB: i18nrs's `dio-ssr` feature (its `#[server]` `get_cookie`/`set_cookie`
    # round-trip) is intentionally not enabled anywhere — locale negotiation is
    # done in `crate::i18n::detect_locale` (server) and `document.cookie`
    # (client), so no i18nrs server endpoint exists to register here.
    "portfolio-data/schema",
    "dep:axum",
    "dep:tower-http",
    "dep:csp-shell",
    "dep:tracing",
    "dep:schemars",
    "dep:time",
    "dep:dioxus-fullstack-core",
    "dep:http",
    "dep:portfolio-config",
]
