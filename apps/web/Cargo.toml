[package]
name = "portfolio-web"
version = "3.2.2"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
homepage.workspace = true

[dependencies]
dioxus.workspace = true
portfolio-data.workspace = true
i18nrs.workspace = true
serde.workspace = true
serde_json.workspace = true
# The legal documents' wire types and page component, which build for `wasm32` without a loader.
terrace-legal-model.workspace = true
terrace-legal-dioxus.workspace = true

# Client-only, behind the `web` feature, so the server never links wasm-bindgen.
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
# Delays for the reveal stagger and the contact type-in animation.
gloo-timers = { workspace = true, optional = true }

# Server-only, behind the `server` feature. Axum unifies with the version dioxus-server
# re-exports, so layers apply to the router `dioxus::server::router` returns.
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# The optional error reporting in `src/server/telemetry.rs`, server-only.
sentry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
time = { workspace = true, features = ["macros"], optional = true }
# The release serve loop's runtime and `SIGTERM` handler, already in the graph through Dioxus.
tokio = { workspace = true, optional = true }
# The current request during SSR, for locale negotiation, pinned to dioxus-fullstack's version.
dioxus-fullstack-core = { version = "=0.7.10", optional = true }
http = { version = "1", optional = true }
# The API, assets, headers and page middleware the router mounts.
portfolio-server = { workspace = true, optional = true }
# The layered configuration, which the client has no filesystem to read.
portfolio-config = { workspace = true, optional = true }
# The validated legal catalog and its JSON routes; the client receives documents, never their
# configuration.
terrace-legal = { workspace = true, optional = true }
terrace-legal-axum = { workspace = true, optional = true }

[build-dependencies]
# `build.rs` names the embedded resume PDFs and app icons from the data crate's tables.
portfolio-data.workspace = true

[dev-dependencies]
# The server tests' router driver and runtime, used under `--features server` only.
tower.workspace = true
tokio.workspace = true
# The telemetry tests build a `SentryConfig` with a malformed DSN, which is a `SecretString`.
secrecy.workspace = true

[features]
# No platform by default, so a bare workspace `cargo check`, `clippy` or `test` compiles only the
# renderer-agnostic code. `dx` selects the feature per platform, and manual checks pass it:
#
#   cargo check -p portfolio-web --no-default-features --features server
#   cargo check -p portfolio-web --no-default-features --features web --target wasm32-unknown-unknown
default = []
web = [
    "dioxus/web",
    "dep:js-sys",
    "dep:web-sys",
    "dep:wasm-bindgen-futures",
    "dep:gloo-timers",
]
server = [
    "dioxus/server",
    "dep:axum",
    "dep:tower-http",
    "dep:portfolio-server",
    "dep:tracing",
    # Always compiled and switched on by `sentry.enabled`, so the key never silently no-ops.
    "dep:sentry",
    "dep:tracing-subscriber",
    "dep:time",
    "dep:tokio",
    "dep:dioxus-fullstack-core",
    "dep:http",
    "dep:portfolio-config",
    "dep:terrace-legal",
    "dep:terrace-legal-axum",
]

[lints]
workspace = true
