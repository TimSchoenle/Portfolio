# Linker for the fully static musl build of the SSR server.
#
# `x86_64-linux-musl-gcc` comes with Debian's `musl-tools`, which the Dockerfile
# installs. The aarch64 leg is configured from the Dockerfile instead (via
# CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER), because its cross toolchain is
# only installed on that matrix leg. Cargo reads this file from the workspace
# root, so it also applies to the `dx bundle` run started in `apps/web` — keep it
# in sync with the Dockerfile's ENV block.
[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"
