[package]
name = "portfolio-config"
version = "2.10.0"
edition.workspace = true
publish.workspace = true

# Off by default, and it has to stay that way: `terrace-config/schema-cli` links
# `serde_json` and compiles a proc macro, neither of which a running binary has
# any use for. Only `cargo run --example config-schema` and the `--all-features`
# CI gates ever turn it on, so nothing it costs reaches the image — the
# Dockerfile builds no feature flags at all.
#
# `schema-cli` rather than `schema`: it is the half of the generator every
# consumer of `schema` was writing by hand — the `--format` vocabulary, the
# argument parsing and the dispatch — and it pulls no dependency `schema` did
# not already. `examples/config-schema.rs` is what is left after taking it.
#
# The `#[config(...)]` helper attributes are gated with it rather than left in
# place: they are the derive's, so a build without the derive fails with
# `cannot find attribute config` the moment one is unconditional.
[features]
config-schema = ["terrace-config/schema-cli"]

# The generator that renders the configuration reference in `README.md`. Listed
# so `cargo clippy --all-targets --all-features` compiles it, which is the only
# thing standing between a new config block and a README that silently omits it.
[[example]]
name = "config-schema"
required-features = ["config-schema"]





# The post-build check on the image's `LABEL` block. All three values are
# constants, so the block is written out in the `Dockerfile` rather than
# generated — which means the ways it goes wrong are invisible to a source diff:
# a line dropped on a branch nobody read, a base image contributing its own.
# `Contract::verify_labels` reads back what `docker inspect` reports and names
# the first label missing or wrong.
[[example]]
name = "verify-labels"
required-features = ["config-schema"]








[dependencies]
serde.workspace = true
# The loader itself. This crate owns the *schema* and the Portfolio dialect
# (`src/loader.rs`) and none of the layering, the secrets-directory provider or
# the shadow-key rejection.
terrace-config.workspace = true
# Config is where the GitHub token enters the process, so it is where the
# wrapper has to start: a `SecretString` field cannot be unwrapped by the
# struct that nests it, so the token stays wrapped until the one line that
# builds the `Authorization` header.
secrecy.workspace = true

[dev-dependencies]
# The loader's own test harness, which is why `src/loader.rs` arranges a mount
# rather than a variable name: every name it writes is derived from the
# `Terrace` under test, so a test cannot keep passing against a spelling this
# crate no longer reads. A development dependency because `testing` is
# deliberately outside `full` — a service asking for everything the crate does
# at runtime should not link a test harness.
terrace-config = { workspace = true, features = ["testing"] }
# The `--format variables` payload the documentation job forwards to the
# template action. `serde_json` reaches this crate only as a development
# dependency, so it stays where `terrace-config/schema` already puts it — in
# the generator — and out of every binary this workspace ships.
serde_json.workspace = true

[lints]
workspace = true
