[package]
name = "portfolio-config"
version = "3.2.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
homepage.workspace = true

# Off by default, and it has to stay off: only the generator examples and the `--all-features`
# gates need the derive and `serde_json`. See docs/DEPENDENCIES.md § Member manifests.
[features]
config-schema = ["terrace-config/schema-cli"]

# Renders the configuration reference, and is compiled by `cargo clippy --all-targets
# --all-features` so it cannot fall behind a new block.
[[example]]
name = "config-schema"
required-features = ["config-schema"]

# Checks a built image's `LABEL` block against the contract and names the first label missing or
# wrong.
[[example]]
name = "verify-labels"
required-features = ["config-schema"]

[dependencies]
serde.workspace = true
# The loader itself; this crate owns only the schema and the Portfolio dialect.
terrace-config.workspace = true
# The GitHub token and the Sentry DSN are wrapped from the moment they are loaded.
secrecy.workspace = true
# `legal.*`, here so the configuration reference describes it with every other block.
terrace-legal.workspace = true

[dev-dependencies]
# The loader's test harness, which derives every name a test writes from the dialect under test.
terrace-config = { workspace = true, features = ["testing"] }
# Used by the generator examples and the tests only, so it stays out of every shipped binary.
serde_json.workspace = true
# The site's languages, which the examples and tests hand to `legal_catalog_builder` so the
# contract is refined with the list the server boots with.
portfolio-data.workspace = true
# Validates configurations against the published contract's JSON Schema, as a consumer would.
jsonschema.workspace = true

[lints]
workspace = true
