# Example configuration for the portfolio workspace.
#
# THIS FILE IS GENERATED. Every key below — its purpose, its type, its default and the
# other spellings that supply it — comes from the `Describe` derives in `crates/config`,
# so it cannot omit a key the binaries read or describe one they do not. Only this
# preamble is hand-written, in `.github/templates/config.example.toml.hbs`; CI renders
# both on every pull request.
#
# Point $PORTFOLIO_CONFIG at a copy of this file, or at a directory holding several
# `*.toml` fragments — merged in sorted order, which is what lets a Kubernetes ConfigMap
# and a Secret land side by side:
#
#   PORTFOLIO_CONFIG=./config.toml cargo run -p portfolio-web --features server
#
# Every optional key is commented out at the value it already has; uncomment one only to
# change it. A key marked "Required" has no default and is left uncommented as a placeholder
# the loader refuses until it is filled in, here or through any other spelling. The three
# spellings named above each key all outrank this file, and they are mutually exclusive per
# key: supplying one key from two of them fails the boot rather than letting a stale
# PORTFOLIO_ variable shadow a rotated mounted secret. README.md carries the whole
# precedence order.
#
# Secrets do not belong in a committed file. The workspace has two, and each can arrive
# as a file: PORTFOLIO_GITHUB__TOKEN_FILE and PORTFOLIO_SENTRY__DSN_FILE name a
# file holding the value, and github__token or sentry__dsn
# inside $PORTFOLIO_SECRETS_DIR is the same value as a mounted `Secret` key.
#
# NOT configured here: IP, PORT and RUST_LOG belong to the Dioxus toolchain, which reads
# them itself, and CI belongs to the CI provider.

[assets]
# Directory holding the `dx bundle` output, relative to the working directory.
#
# The image runs from `/app`, next to `public/`, so the default resolves without anything
# being set.
# Type: PathBuf
# Also from: PORTFOLIO_ASSETS__DIST_DIR, PORTFOLIO_ASSETS__DIST_DIR_FILE=/path/to/file,
#   assets__dist_dir in the secrets directory
# dist_dir = "public"

[csp]
# Whether the server admits inline `<script>` by hash, in place of `'unsafe-inline'`.
#
# On, the default, the server hashes the response body it is about to send, so the only
# inline scripts that run are the ones it rendered. `'unsafe-inline'` admits an injected
# `<script>` as readily as the Dioxus hydration bootstrap.
#
# Off restores `'unsafe-inline'` with a restart. Use it when the browser refuses an inline
# script the scanner does not see, which shows as a blank page and a console message. Known
# cases are a development server that injects a live-reload script downstream of this
# process, and a renderer change that emits script this server never sees.
#
# A policy carrying any hash or nonce makes `'unsafe-inline'` inert, so turning this off also
# requires `csp.cloudflare.script_nonce = false`. [`validate`](Self::validate) refuses the
# boot otherwise.
# Type: bool
# Also from: PORTFOLIO_CSP__HASH_INLINE_SCRIPTS,
#   PORTFOLIO_CSP__HASH_INLINE_SCRIPTS_FILE=/path/to/file, csp__hash_inline_scripts in the secrets
#   directory
# hash_inline_scripts = true

[csp.cloudflare]
# Whether `script-src` reserves a per-response nonce for the script Cloudflare injects at the
# edge.
#
# On by default, because this site is delivered through a Cloudflare Tunnel with the bot
# products active; the `__cf_bm` and `cf_clearance` cookies are theirs. Those products inject
# an inline `<script>` after the HTML leaves this process, so no hash the server computes can
# cover it, and without the nonce the detection silently never runs. Cloudflare reads the
# nonce from the `Content-Security-Policy` response header and copies it onto what it
# injects.
#
# The server sends `Cache-Control: no-cache` on every document, so a cache must revalidate a
# stored copy with this origin before each reuse. A document carries no validator, so every
# reuse reaches the server, which mints a fresh nonce per response. **No Cloudflare Cache
# Rule may cache the documents**: a "Cache Everything" rule overrides that header at the
# edge, and nothing inside this process can see it.
# Type: bool
# Also from: PORTFOLIO_CSP__CLOUDFLARE__SCRIPT_NONCE,
#   PORTFOLIO_CSP__CLOUDFLARE__SCRIPT_NONCE_FILE=/path/to/file, csp__cloudflare__script_nonce in
#   the secrets directory
# script_nonce = true

# Whether `script-src` and `frame-src` admit `https://challenges.cloudflare.com`, for a
# Turnstile widget.
#
# Off, because this site has no form behind a challenge. A managed-challenge interstitial
# needs nothing here: it is a Cloudflare-served document carrying its own policy.
# Type: bool
# Also from: PORTFOLIO_CSP__CLOUDFLARE__TURNSTILE,
#   PORTFOLIO_CSP__CLOUDFLARE__TURNSTILE_FILE=/path/to/file, csp__cloudflare__turnstile in the
#   secrets directory
# turnstile = false

# Whether the policy admits the Cloudflare Web Analytics beacon and the endpoint it reports
# to.
#
# Off, because this site measures nothing, which the privacy page states. It covers the
# manual snippet only; the automatic edge injection is an inline script and needs
# `script_nonce`.
# Type: bool
# Also from: PORTFOLIO_CSP__CLOUDFLARE__WEB_ANALYTICS,
#   PORTFOLIO_CSP__CLOUDFLARE__WEB_ANALYTICS_FILE=/path/to/file, csp__cloudflare__web_analytics in
#   the secrets directory
# web_analytics = false

[hsts]
# How long, in seconds, a browser keeps to HTTPS after seeing the header. Zero clears it.
#
# Zero is the documented way to withdraw HSTS: a browser drops a host it learned from this
# header on the next response. A host already on the preload list stays there until its
# removal reaches browsers in a release. Zero is refused together with `preload`, which it
# would contradict.
# Type: u64
# Also from: PORTFOLIO_HSTS__MAX_AGE_SECS, PORTFOLIO_HSTS__MAX_AGE_SECS_FILE=/path/to/file,
#   hsts__max_age_secs in the secrets directory
# max_age_secs = 31536000

# Whether the policy covers every subdomain as well, as `includeSubDomains`.
# Type: bool
# Also from: PORTFOLIO_HSTS__INCLUDE_SUBDOMAINS,
#   PORTFOLIO_HSTS__INCLUDE_SUBDOMAINS_FILE=/path/to/file, hsts__include_subdomains in the secrets
#   directory
# include_subdomains = true

# Whether the header asks for the host to be included in the browsers' built-in HSTS preload
# list, as `preload`.
#
# The boot enforces the list's own requirements: `include_subdomains` on and a
# `max_age_secs` of at least one year.
# Type: bool
# Also from: PORTFOLIO_HSTS__PRELOAD, PORTFOLIO_HSTS__PRELOAD_FILE=/path/to/file, hsts__preload in
#   the secrets directory
# preload = true

[isr]
# The writable directory rendered HTML is cached into. Unset or empty disables ISR.
#
# Keep it outside the bundled `public/` asset tree so those content-hashed assets stay
# immutable. The image points it at a sub-directory of `/tmp`, which the deployment provides
# as a writable mount even under a read-only root filesystem.
# Type: PathBuf
# Also from: PORTFOLIO_ISR__CACHE_DIR, PORTFOLIO_ISR__CACHE_DIR_FILE=/path/to/file, isr__cache_dir
#   in the secrets directory
# Unset by default: the value below is only the shape.
# cache_dir = "<value>"

# The revalidation interval in seconds. Zero means a permanent cache.
#
# A page changes only with a new build or a new `legal.*` configuration, and the server keeps
# whatever the directory holds at boot. Permanent suits a directory that starts empty with
# every pod. A container restart inside the same pod keeps the mount and its pages, so a
# `legal.*` change applied by a restart needs a positive value, a cleared directory or a new
# pod. A cache volume that outlives a deploy needs a positive value for the same reason.
# Type: u64
# Also from: PORTFOLIO_ISR__TTL_SECS, PORTFOLIO_ISR__TTL_SECS_FILE=/path/to/file, isr__ttl_secs in
#   the secrets directory
# ttl_secs = 0

[sentry]
# Whether the server initializes the Sentry client. Off installs no client, panic hook,
# `tracing` layer or HTTP middleware, and nothing leaves the process.
#
# It also decides who owns the log subscriber. Off, the Dioxus toolchain installs its own.
# On, the server installs one first, still reading `RUST_LOG` and formatting the same way,
# because a Sentry layer has to be a layer of the subscriber.
# Type: bool
# Also from: PORTFOLIO_SENTRY__ENABLED, PORTFOLIO_SENTRY__ENABLED_FILE=/path/to/file,
#   sentry__enabled in the secrets directory
# enabled = false

# The ingest URL, `https://<key>@<host>/<project>`.
#
# The embedded key is a bearer credential for the project's ingest endpoint. Supply it as
# `PORTFOLIO_SENTRY__DSN_FILE=/run/secrets/sentry_dsn`, or as `sentry__dsn` inside
# `$PORTFOLIO_SECRETS_DIR`, so it never enters the process environment, where
# `/proc/<pid>/environ`, a crash dump and `docker inspect` all carry it and every child
# process inherits it.
#
# Absent while `sentry.enabled` is set, it fails the boot.
# Type: SecretString
# Also from: PORTFOLIO_SENTRY__DSN, PORTFOLIO_SENTRY__DSN_FILE=/path/to/file, sentry__dsn in the
#   secrets directory
# Secret: the value below is a placeholder.
# dsn = "<secret>"

# The environment tag on every event.
#
# Unset resolves to `production` for a release build and `development` otherwise. The
# workspace ships one image, so the build profile is what separates a developer's
# `dx serve` from the deployed container.
# Type: String
# Also from: PORTFOLIO_SENTRY__ENVIRONMENT, PORTFOLIO_SENTRY__ENVIRONMENT_FILE=/path/to/file,
#   sentry__environment in the secrets directory
# Unset by default: the value below is only the shape.
# environment = "<value>"

# The release tag on every event.
#
# Unset resolves to `portfolio@<version>`, the workspace version the binary was built from.
# Every deploy is a new image cut from a new version, so the tag attributes a regression to
# a deploy.
# Type: String
# Also from: PORTFOLIO_SENTRY__RELEASE, PORTFOLIO_SENTRY__RELEASE_FILE=/path/to/file,
#   sentry__release in the secrets directory
# Unset by default: the value below is only the shape.
# release = "<value>"

# The host tag on every event. Unset reports none.
#
# The hostname of a replica is infrastructure detail, and this site runs one image behind a
# tunnel, so it identifies nothing an event does not already say.
# Type: String
# Also from: PORTFOLIO_SENTRY__SERVER_NAME, PORTFOLIO_SENTRY__SERVER_NAME_FILE=/path/to/file,
#   sentry__server_name in the secrets directory
# Unset by default: the value below is only the shape.
# server_name = "<value>"

# The fraction of captured events sent, from `0.0` to `1.0`.
#
# It is a blunt volume cap: a rare bug is as likely to be dropped as a noisy one. Leave it
# at `1.0` unless a quota forces otherwise.
# Type: f32
# Also from: PORTFOLIO_SENTRY__SAMPLE_RATE, PORTFOLIO_SENTRY__SAMPLE_RATE_FILE=/path/to/file,
#   sentry__sample_rate in the secrets directory
# sample_rate = 1.0

# The fraction of request traces recorded, from `0.0` to `1.0`.
#
# The rate decides for a request that arrives without a sampling decision. A request whose
# `sentry-trace` header carries one keeps it, so a caller can have its request recorded even
# at the default, `0.0`. `sentry.http_transactions = false` starts no request transaction at
# all. The default keeps ordinary traffic from sending performance data when Sentry is on for
# crash reporting. `0.05` to `0.2` is an ordinary production figure.
# Type: f32
# Also from: PORTFOLIO_SENTRY__TRACES_SAMPLE_RATE,
#   PORTFOLIO_SENTRY__TRACES_SAMPLE_RATE_FILE=/path/to/file, sentry__traces_sample_rate in the
#   secrets directory
# traces_sample_rate = 0.0

# The least severe `tracing` level reported as a Sentry issue.
# Type: SentryLevel — one of: off, error, warn, info, debug, trace
# Also from: PORTFOLIO_SENTRY__CAPTURE_LEVEL, PORTFOLIO_SENTRY__CAPTURE_LEVEL_FILE=/path/to/file,
#   sentry__capture_level in the secrets directory
# capture_level = "error"

# The least severe `tracing` level kept as a breadcrumb, the trail attached to the next
# issue.
#
# Records at or above `sentry.capture_level` become issues instead, so the two thresholds
# partition the stream.
# Type: SentryLevel — one of: off, error, warn, info, debug, trace
# Also from: PORTFOLIO_SENTRY__BREADCRUMB_LEVEL,
#   PORTFOLIO_SENTRY__BREADCRUMB_LEVEL_FILE=/path/to/file, sentry__breadcrumb_level in the secrets
#   directory
# breadcrumb_level = "info"

# The most breadcrumbs one event carries.
# Type: usize
# Also from: PORTFOLIO_SENTRY__MAX_BREADCRUMBS,
#   PORTFOLIO_SENTRY__MAX_BREADCRUMBS_FILE=/path/to/file, sentry__max_breadcrumbs in the secrets
#   directory
# max_breadcrumbs = 100

# Whether events that carry no stack trace of their own get one attached.
# Type: bool
# Also from: PORTFOLIO_SENTRY__ATTACH_STACKTRACES,
#   PORTFOLIO_SENTRY__ATTACH_STACKTRACES_FILE=/path/to/file, sentry__attach_stacktraces in the
#   secrets directory
# attach_stacktraces = true

# Whether every event carries personally identifying data: the client IP, the full request
# header set including `Cookie`, and the resolved user.
#
# **Off, and worth leaving off.** A crash report is actionable without a reader's IP address
# and cookies, and every event sent is personal data handed to a third party, which the
# published privacy notice would then have to name. On, it also stops the HTTP middleware
# from redacting sensitive request headers.
# Type: bool
# Also from: PORTFOLIO_SENTRY__SEND_DEFAULT_PII,
#   PORTFOLIO_SENTRY__SEND_DEFAULT_PII_FILE=/path/to/file, sentry__send_default_pii in the secrets
#   directory
# send_default_pii = false

# Whether the server records one Sentry transaction per request, named by the matched route.
#
# Naming by route keeps `/api/v1/legal/{slug}` one transaction name for every document.
# Whether a started transaction is kept is `sentry.traces_sample_rate`'s decision. Off starts
# no transaction, but the HTTP middleware stays installed and still attaches the request to
# events.
# Type: bool
# Also from: PORTFOLIO_SENTRY__HTTP_TRANSACTIONS,
#   PORTFOLIO_SENTRY__HTTP_TRANSACTIONS_FILE=/path/to/file, sentry__http_transactions in the
#   secrets directory
# http_transactions = true

# Whether `tracing` span fields are copied onto the Sentry span as attributes.
#
# Off, because span fields here carry request paths and the negotiated locale, and a
# transaction is stored under a longer retention than a log line.
# Type: bool
# Also from: PORTFOLIO_SENTRY__SPAN_ATTRIBUTES,
#   PORTFOLIO_SENTRY__SPAN_ATTRIBUTES_FILE=/path/to/file, sentry__span_attributes in the secrets
#   directory
# span_attributes = false

# Whether the SDK prints its own diagnostics to stderr, for proving a DSN works.
# Type: bool
# Also from: PORTFOLIO_SENTRY__DEBUG, PORTFOLIO_SENTRY__DEBUG_FILE=/path/to/file, sentry__debug in
#   the secrets directory
# debug = false

[legal]
# Locale served when neither the request nor its `Accept-Language` header matches a
# published one, for example `en`. Without it, the first published locale in alphabetical
# order is served.
# Type: String
# Also from: PORTFOLIO_LEGAL__DEFAULT_LOCALE, PORTFOLIO_LEGAL__DEFAULT_LOCALE_FILE=/path/to/file,
#   legal__default_locale in the secrets directory
# Unset by default: the value below is only the shape.
# default_locale = "<value>"

# The published documents, keyed by the slug their URL uses. A slug is lowercase letters,
# digits, `_` and `-`, at most 64 characters, and starts with a letter or a digit.
# Type: BTreeMap<String, LegalDocument>
# Must contain: imprint, privacy
# Also from: PORTFOLIO_LEGAL__DOCUMENTS, PORTFOLIO_LEGAL__DOCUMENTS_FILE=/path/to/file,
#   legal__documents in the secrets directory
# Required: nothing loads until this key is supplied.
documents = {}

[github]
# The user whose repositories to list.
#
# Unset falls back to the site's own identity in `portfolio_data::CONFIG`, which the builder
# resolves.
# Type: String
# Also from: PORTFOLIO_GITHUB__USERNAME, PORTFOLIO_GITHUB__USERNAME_FILE=/path/to/file,
#   github__username in the secrets directory
# Unset by default: the value below is only the shape.
# username = "<value>"

# The bearer token that lifts the GitHub API rate limit.
#
# Optional: the listing is public, so an unauthenticated build still works, just against the
# anonymous quota.
#
# One of the workspace's two secrets, beside `sentry.dsn`. Supply it as
# `PORTFOLIO_GITHUB__TOKEN_FILE=/run/secrets/gh_token` (or from a secrets directory) so it
# never enters the process environment, where `/proc/<pid>/environ`, a crash dump or a
# `docker inspect` would carry it.
# Type: SecretString
# Also from: PORTFOLIO_GITHUB__TOKEN, PORTFOLIO_GITHUB__TOKEN_FILE=/path/to/file, github__token in
#   the secrets directory
# Secret: the value below is a placeholder.
# token = "<secret>"

# The repositories to list, in place of every active repository and its filtering.
#
# It is an array in both spellings: `repos = ["Portfolio", "actions"]` in TOML, and
# `PORTFOLIO_GITHUB__REPOS=[Portfolio,actions]` in the environment. A bare comma-separated
# string is not accepted.
# Type: Vec<String>
# Also from: PORTFOLIO_GITHUB__REPOS, PORTFOLIO_GITHUB__REPOS_FILE=/path/to/file, github__repos in
#   the secrets directory
# repos = []
